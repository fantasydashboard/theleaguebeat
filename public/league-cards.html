/**
 * The all-time wins race, live.
 *
 *   ?view=x-race            (&lg=ffl for the second tier)
 *
 * WHY THIS IS NOT `x-record`. That card is baked — a hand-written
 * MARKERS table, dated "through 2025". It has already gone stale: it
 * still reads "Gridiron Man sits one back on 59" when the two of them
 * have been level on 60 since Sunday. A record that is ABOUT to change
 * hands cannot be served by a constant.
 *
 * So this walks the season chain and counts. Regular season only —
 * `roster.settings.wins` excludes playoffs, which is the number a
 * league argues about.
 *
 * KEYED ON OWNER. Team names move, roster ids are reassigned; the
 * owner id is the only thing Sleeper keeps stable across seasons.
 */
async function careerWins(cfg) {
  // Walk back through previous_league_id, oldest season last.
  const chain = []
  let id = cfg.id
  for (let i = 0; i < 12 && id; i++) {
    const lg = await fetch(`https://api.sleeper.app/v1/league/${id}`).then((r) => r.json())
    if (!lg?.league_id) break
    chain.push(lg)
    id = lg.previous_league_id
  }
  const acc = {}
  for (const lg of chain) {
    const rosters = await fetch(
      `https://api.sleeper.app/v1/league/${lg.league_id}/rosters`,
    ).then((r) => r.json())
    for (const r of rosters) {
      if (!r.owner_id) continue
      const st = r.settings || {}
      const a = (acc[r.owner_id] ||= { wins: 0, losses: 0, pts: 0 })
      a.wins += st.wins ?? 0
      a.losses += st.losses ?? 0
      a.pts += (st.fpts ?? 0) + (st.fpts_decimal ?? 0) / 100
    }
  }
  return { acc, seasons: chain.length }
}

async function loadXRace() {
  const cfg = LEAGUES[params.get('lg') === 'ffl' ? 'ffl' : 'lor']
  const [{ acc, seasons }, rosters, users, matchups] = await Promise.all([
    careerWins(cfg),
    fetch(`https://api.sleeper.app/v1/league/${cfg.id}/rosters`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/league/${cfg.id}/users`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/state/nfl`)
      .then((r) => r.json())
      .then((st) => fetch(`https://api.sleeper.app/v1/league/${cfg.id}/matchups/${st.week}`)
        .then((r) => r.json()).then((ms) => ({ week: st.week, ms }))),
  ])

  const byId = Object.fromEntries(users.map((u) => [u.user_id, u]))
  // Who is playing whom this week, so the card can say what is at stake.
  const oppOf = {}
  const groups = {}
  for (const m of matchups.ms) {
    if (m.matchup_id == null) continue
    ;(groups[m.matchup_id] ||= []).push(m)
  }
  const ownerOfRoster = Object.fromEntries(rosters.map((r) => [String(r.roster_id), r.owner_id]))
  for (const pair of Object.values(groups)) {
    if (pair.length !== 2) continue
    const [a, b] = pair.map((x) => ownerOfRoster[String(x.roster_id)])
    if (a && b) { oppOf[a] = b; oppOf[b] = a }
  }

  const teamOf = (owner) => {
    const u = byId[owner] || {}
    const md = u.metadata || {}
    // NEVER display_name — that is a Sleeper username.
    return {
      team: (md.team_name || 'Team').trim(),
      avatar: md.avatar || (u.avatar ? `https://sleepercdn.com/avatars/${u.avatar}` : null),
    }
  }

  const live = rosters.filter((r) => r.owner_id && acc[r.owner_id])
    .map((r) => ({ owner: r.owner_id, ...acc[r.owner_id], ...teamOf(r.owner_id) }))
    .sort((a, b) => b.wins - a.wins || b.pts - a.pts)

  const top = live[0]?.wins ?? 0
  const rows = live.slice(0, Number(params.get('n') || 4)).map((t) => {
    const back = top - t.wins
    const opp = oppOf[t.owner] ? teamOf(oppOf[t.owner]).team : null
    const stake = back === 0
      ? (live.filter((x) => x.wins === top).length > 1
          ? 'Level at the top of the league’s history'
          : 'The record, outright')
      : `${back} back`
    const sub = opp
      ? `${stake} · plays ${opp} this week`
      : `${stake} · idle this week`
    return `<div class="xc-row">
      ${xcAv(t.team, t.avatar)}
      <span class="xc-lines">
        <span class="xc-name">${esc(t.team)}</span>
        <span class="xc-sub">${esc(sub)}</span>
      </span>
      ${xcStat(String(t.wins), 'wins')}
    </div>`
  }).join('')

  document.getElementById('safe').innerHTML = xcShell({
    league: cfg.name,
    title: params.get('title') || 'The all-time wins record',
    when: params.get('when') || `${seasons} seasons · week ${matchups.week}`,
    rows,
  })
}

/**
 * The week's headliners: the three players on THIS league's rosters
 * who beat their position hardest, framed as next issue's subjects.
 *
 *   ?view=x-headliners&wk=1        (&lg=ffl for the second tier)
 *
 * "Outperformed their position" is measured against the average
 * half-PPR score of that position's startable universe this week —
 * top 12 QBs/TEs, top 24 RBs/WRs, NFL-wide. A flat 30-point game is
 * not the story; 30 from a position that averaged 12 is.
 *
 * RUN IT TUESDAY. Sleeper's week stats accumulate live, so mid-week
 * this shows the leaders of a week still being played.
 */
const STARTABLE = { QB: 12, RB: 24, WR: 24, TE: 12 }

/** Top N players by points over their position's startable average
 *  this week. pool 'league' reads this league's rosters (headliners
 *  card); pool 'nfl' reads the whole slate (the cover — a marketing
 *  asset about leagues everywhere, not about ours). */
async function weekHeadliners(cfg, wk, n, pool = 'league') {
  const table = await rankedTeams(cfg)              // primes _prCache
  const [league, rosters, , proj] = _prCache[cfg.id]
  const season = league.season

  const stats = await fetch(
    `https://api.sleeper.app/v1/stats/nfl/regular/${season}/${wk}`,
  ).then((r) => r.json())

  // Names and positions ride along from the projections sweep.
  const meta = {}
  for (const row of proj) {
    meta[String(row.player_id)] = {
      name: [row.player?.first_name, row.player?.last_name].filter(Boolean).join(' '),
      pos: row.player?.position ?? '',
    }
  }

  // Positional baselines from the whole NFL week, not this league.
  const byPos = { QB: [], RB: [], WR: [], TE: [] }
  for (const [id, s] of Object.entries(stats)) {
    const pos = meta[id]?.pos
    const pts = s?.pts_half_ppr
    if (byPos[pos] && typeof pts === 'number') byPos[pos].push(pts)
  }
  const baseline = {}
  for (const [pos, arr] of Object.entries(byPos)) {
    const top = arr.sort((a, b) => b - a).slice(0, STARTABLE[pos])
    baseline[pos] = top.length ? top.reduce((t, x) => t + x, 0) / top.length : 0
  }

  const candidates = []
  if (pool === 'nfl') {
    for (const [id, s] of Object.entries(stats)) {
      const m = meta[id]
      const pts = s?.pts_half_ppr
      if (!m || !baseline[m.pos] || typeof pts !== 'number') continue
      candidates.push({ id, ...m, pts, team: null, diff: pts - baseline[m.pos] })
    }
  } else {
    // Who owns whom, so the paper can say whose week it made.
    const teamByOwner = Object.fromEntries(table.map((t) => [t.owner, t]))
    for (const r of rosters) {
      const team = teamByOwner[r.owner_id]
      if (!team) continue
      for (const id of r.players || []) {
        const m = meta[id]
        const pts = stats[id]?.pts_half_ppr
        if (!m || !baseline[m.pos] || typeof pts !== 'number') continue
        candidates.push({ id, ...m, pts, team, diff: pts - baseline[m.pos] })
      }
    }
  }
  return candidates.sort((a, b) => b.diff - a.diff).slice(0, n)
}

/**
 * The other end of the same measurement: the week's letdowns.
 *
 *   ?view=x-duds&wk=1              NFL-wide, for the main channel
 *   ?view=x-duds&wk=1&pool=league  the house edition, by who STARTED them
 *
 * TWO POOLS, BECAUSE "DUD" MEANS TWO DIFFERENT THINGS.
 *
 * `league` measures who was STARTED and did nothing, which is the most
 * shareable fact a league paper holds — every reader has done it. But
 * it only exists inside a league, and it puts that league's team names
 * on the card, so it is the house edition and nothing else.
 *
 * `nfl` is the default and carries no league at all. Nobody can say
 * who "started" a player league-wide, so the yardstick is the player's
 * OWN line: season projection over seventeen, the same basis every
 * other card in this file quotes. A letdown is a player the whole
 * fantasy world drafted to start who then did not turn up.
 *
 * Restricted to the startable tier by PROJECTION — top 12 QB/TE, top
 * 24 RB/WR — because a fourth-string running back scoring nothing is
 * not news; he was not in anybody's lineup.
 */
async function weekDuds(cfg, wk, n, pool = 'nfl') {
  const table = await rankedTeams(cfg)              // primes _prCache
  const [league, rosters, , proj] = _prCache[cfg.id]

  const stats = await fetch(
    `https://api.sleeper.app/v1/stats/nfl/regular/${league.season}/${wk}`,
  ).then((r) => r.json())

  const meta = {}
  for (const row of proj) {
    meta[String(row.player_id)] = {
      name: [row.player?.first_name, row.player?.last_name].filter(Boolean).join(' '),
      pos: row.player?.position ?? '',
      nfl: row.player?.team ?? '',
      // The line: season projection over seventeen, half-PPR.
      line: (row.stats?.pts_half_ppr ?? 0) / 17,
    }
  }

  if (pool === 'nfl') {
    // Who the fantasy world drafted to start, by projection.
    const ranked = { QB: [], RB: [], WR: [], TE: [] }
    for (const [id, m] of Object.entries(meta)) {
      if (ranked[m.pos] && m.line > 0) ranked[m.pos].push({ id, ...m })
    }
    const startable = new Set()
    for (const [pos, arr] of Object.entries(ranked)) {
      arr.sort((a, b) => b.line - a.line)
      for (const p of arr.slice(0, STARTABLE[pos])) startable.add(p.id)
    }
    const out = []
    for (const id of startable) {
      const m = meta[id]
      const pts = stats[id]?.pts_half_ppr
      // No stat line at all is a bye or an inactive, not a bad game.
      if (typeof pts !== 'number') continue
      out.push({ id, ...m, pts, team: null, diff: pts - m.line, base: m.line })
    }
    return out.sort((a, b) => a.diff - b.diff).slice(0, n)
  }

  // House edition: who was actually started, against the position's
  // startable average that week — same baseline as the headliners card.
  const ms = await fetch(
    `https://api.sleeper.app/v1/league/${cfg.id}/matchups/${wk}`,
  ).then((r) => r.json())

  const byPos = { QB: [], RB: [], WR: [], TE: [] }
  for (const [id, st] of Object.entries(stats)) {
    const pos = meta[id]?.pos
    const pts = st?.pts_half_ppr
    if (byPos[pos] && typeof pts === 'number') byPos[pos].push(pts)
  }
  const baseline = {}
  for (const [pos, arr] of Object.entries(byPos)) {
    const top = arr.sort((a, b) => b - a).slice(0, STARTABLE[pos])
    baseline[pos] = top.length ? top.reduce((t, x) => t + x, 0) / top.length : 0
  }

  const teamByOwner = Object.fromEntries(table.map((t) => [t.owner, t]))
  const ownerOf = Object.fromEntries(rosters.map((r) => [String(r.roster_id), r.owner_id]))
  const out = []
  for (const m of ms) {
    const team = teamByOwner[ownerOf[String(m.roster_id)]]
    if (!team) continue
    for (const id of m.starters || []) {
      const mm = meta[id]
      const pts = stats[id]?.pts_half_ppr
      // A blank id is an empty lineup slot, not a player who scored 0.
      if (!mm || !baseline[mm.pos] || typeof pts !== 'number') continue
      out.push({ id, ...mm, pts, team, diff: pts - baseline[mm.pos], base: baseline[mm.pos] })
    }
  }
  return out.sort((a, b) => a.diff - b.diff).slice(0, n)
}

/**
 * Monday night's sweat card: the biggest names still to play, and
 * the line each is expected to hit.
 *
 *   ?view=x-mnf            (&wk=N to override; defaults to the live week)
 *
 * "The line" is the same basis as every other card in this file —
 * season projection per week, half-PPR — so no two graphics can
 * quote different numbers for the same player. Matchups come from
 * the real schedule: any game this week dated a Monday.
 */
/**
 * The position board — the week's best at one position, by name.
 *
 *   ?view=x-top&pos=TE&wk=2          (&n=10, &ratio=1x1 by default)
 *
 * WHY THIS EXISTS. It is the only format on the account that travels.
 * Nobody searches a fantasy team's name; a hundred thousand people a
 * week search a tight end's. Every row is a real player, a real
 * headshot and a real number, and the whole card is league-agnostic —
 * it says nothing about anybody's roster.
 *
 * RESULTS, NOT PROJECTIONS, which is the line between this and the
 * sibling dashboard. That product ranks what a player WILL do and
 * sorts him into tiers. This is a magazine: it reports the week that
 * happened, and the number that matters is how far clear of his own
 * position a man finished.
 *
 * ONE BREAK, NOT A TIER SYSTEM. A taxonomy of tiers belongs to a
 * projection tool. A paper points at the single place the week broke —
 * the biggest drop between two consecutive finishers.
 */
const POS_LABEL = {
  QB: ['quarterback', 'quarterbacks'],
  RB: ['running back', 'running backs'],
  WR: ['receiver', 'receivers'],
  TE: ['tight end', 'tight ends'],
}
const NUM_WORD = ['zero','one','two','three','four','five','six','seven','eight','nine','ten']

async function loadXTop() {
  const pos = (params.get('pos') || 'TE').toUpperCase()
  const n = Number(params.get('n') || 10)
  const cfg = LEAGUES.lor                       // only used to prime the projections sweep
  await rankedTeams(cfg)
  const [league, , , proj] = _prCache[cfg.id]
  const state = await fetch('https://api.sleeper.app/v1/state/nfl').then((r) => r.json())
  const wk = Number(params.get('wk') || state.week || 1)

  const [stats, sched] = await Promise.all([
    fetch(`https://api.sleeper.app/v1/stats/nfl/regular/${league.season}/${wk}`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/schedule/nfl/regular/${league.season}`)
      .then((r) => r.json()).catch(() => []),
  ])

  // Who each team played that week, so a row can carry the fixture.
  const oppOf = {}
  for (const g of Array.isArray(sched) ? sched : []) {
    if (Number(g.week) !== wk) continue
    if (g.home) oppOf[g.home] = g.away
    if (g.away) oppOf[g.away] = `@${g.home}`
  }

  const meta = {}
  for (const row of proj) {
    meta[String(row.player_id)] = {
      name: [row.player?.first_name, row.player?.last_name].filter(Boolean).join(' '),
      pos: row.player?.position ?? '',
      nfl: row.player?.team ?? '',
    }
  }

  const all = []
  for (const [id, st] of Object.entries(stats)) {
    const m = meta[id]
    const pts = st?.pts_half_ppr
    if (!m || m.pos !== pos || typeof pts !== 'number') continue
    all.push({ id, ...m, pts })
  }
  all.sort((a, b) => b.pts - a.pts)
  if (all.length === 0) {
    document.getElementById('safe').innerHTML =
      `<div class="err">No ${esc(pos)} stats for week ${wk} yet.</div>`
    return
  }

  // What a startable player at this position actually returned.
  const startable = all.slice(0, STARTABLE[pos] ?? 12)
  const avg = startable.reduce((t, p) => t + p.pts, 0) / startable.length

  const top = all.slice(0, n)
  // The single biggest drop inside the list — where the week broke.
  let breakAt = -1, breakGap = 0
  for (let i = 1; i < top.length; i++) {
    const gap = top[i - 1].pts - top[i].pts
    if (gap > breakGap) { breakGap = gap; breakAt = i }
  }
  // A gap has to be worth a rule. Below this it is just the next name.
  if (breakGap < 2) breakAt = -1

  const rows = top.map((p, i) => {
    const rule = i === breakAt
      ? `<div class="tp-break">${breakGap.toFixed(1)} points, and the week breaks</div>`
      : ''
    const logo = p.nfl
      ? `<img class="tp-logo" src="https://sleepercdn.com/images/team_logos/nfl/${esc(p.nfl.toLowerCase())}.png" alt="" onerror="this.remove()">`
      : '<span class="tp-logo"></span>'
    return `${rule}
      <div class="tp-row">
        <span class="tp-rank">${i + 1}</span>
        <span class="tp-face"><img src="https://sleepercdn.com/content/nfl/players/${esc(p.id)}.jpg"
          alt="" onerror="this.remove()"></span>
        ${logo}
        <span class="tp-name">${esc(p.name)}</span>
        <span class="tp-vs">${esc(oppOf[p.nfl] || '')}</span>
        <span class="tp-pts">${p.pts.toFixed(1)}</span>
      </div>`
  }).join('')

  const [one, many] = POS_LABEL[pos] || [pos, pos]
  document.getElementById('safe').innerHTML = `
    <div class="xc" style="height:100%">
      <div class="xc-top">
        <span class="xc-mark">The League Beat</span>
        <span class="xc-league">Week ${wk}</span>
      </div>
      <div class="xc-rule"></div>
      <div class="tp-head">
        <div class="tp-chip">Week ${wk} · ${esc(pos)}</div>
        <div class="tp-title">The ${esc(NUM_WORD[n] || n)} best<br><em>${esc(many)}</em> of the week</div>
        <div class="tp-sub">The average starting ${esc(one)} scored ${avg.toFixed(1)}.
          Half-PPR, top ${STARTABLE[pos] ?? 12} at the position.</div>
      </div>
      <div class="tp-rows">${rows}</div>
      <div class="tp-foot">
        <span class="l">theleaguebeat.com</span>
        <span class="r">Your league, written up. Free.</span>
      </div>
    </div>`
}

/**
 * The wire, everywhere — what every league on earth is adding.
 *
 *   ?view=x-wire-nfl&hours=48&n=10   (&mode=drop for the other side)
 *
 * NFL-WIDE AND LEAGUE-FREE. Sleeper aggregates adds across every
 * league it hosts, so this needs no league, no roster and no account —
 * and the counts run to seven figures, which is a scale no single
 * league can put on a card.
 *
 * Renders through the same row as the position board. One format, many
 * cards: a reader learns the shape once and every card after it is
 * free to read.
 */
async function loadXWireNfl() {
  const hours = Number(params.get('hours') || 48)
  const n = Number(params.get('n') || 10)
  const mode = params.get('mode') === 'drop' ? 'drop' : 'add'

  const [rows, other, state, db] = await Promise.all([
    fetch(`https://api.sleeper.app/v1/players/nfl/trending/${mode}?lookback_hours=${hours}&limit=${n + 4}`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/players/nfl/trending/${mode === 'add' ? 'drop' : 'add'}?lookback_hours=${hours}&limit=60`).then((r) => r.json()),
    fetch('https://api.sleeper.app/v1/state/nfl').then((r) => r.json()),
    fetch('https://api.sleeper.app/v1/players/nfl').then((r) => r.json()),
  ])
  const wk = Number(params.get('wk') || state.week || 1)
  const counter = Object.fromEntries((other || []).map((d) => [String(d.player_id), d.count]))

  const list = (rows || []).slice(0, n).map((r) => {
    const p = db[String(r.player_id)] || {}
    return {
      id: String(r.player_id),
      name: `${p.first_name ?? ''} ${p.last_name ?? ''}`.trim() || String(r.player_id),
      pos: p.position ?? '',
      nfl: p.team ?? '',
      count: r.count,
      // A player being added AND dropped in the same 48 hours is the
      // most interesting thing this feed knows.
      against: counter[String(r.player_id)],
    }
  })
  if (list.length === 0) {
    document.getElementById('safe').innerHTML = '<div class="err">No trending data right now.</div>'
    return
  }

  // Where the run breaks — the biggest fall between consecutive rows.
  let breakAt = -1, gap = 0
  for (let i = 1; i < list.length; i++) {
    const g = list[i - 1].count - list[i].count
    if (g > gap) { gap = g; breakAt = i }
  }
  // Only worth a rule when the drop is most of the row above it.
  if (gap < list[0].count * 0.25) breakAt = -1

  const fmt = (x) => x.toLocaleString('en-US')
  const body = list.map((p, i) => {
    const rule = i === breakAt
      ? `<div class="tp-break">${fmt(gap)} fewer, and the run breaks</div>` : ''
    // A defence has no headshot; its own logo is the portrait.
    const logoUrl = p.nfl ? `https://sleepercdn.com/images/team_logos/nfl/${p.nfl.toLowerCase()}.png` : ''
    const face = p.pos === 'DEF' && logoUrl
      ? `<span class="tp-face" style="background:oklch(0.17 0.012 90)"><img src="${esc(logoUrl)}"
           style="width:70%;height:70%;object-fit:contain;object-position:center" alt="" onerror="this.remove()"></span>`
      : `<span class="tp-face"><img src="https://sleepercdn.com/content/nfl/players/${esc(p.id)}.jpg"
           alt="" onerror="this.remove()"></span>`
    return `${rule}
      <div class="tp-row wide">
        <span class="tp-rank">${i + 1}</span>
        ${face}
        ${logoUrl ? `<img class="tp-logo" src="${esc(logoUrl)}" alt="" onerror="this.remove()">` : '<span class="tp-logo"></span>'}
        <span class="tp-name">${esc(p.name)}</span>
        <span class="tp-vs">${esc(p.pos)}</span>
        <span class="tp-pts">${fmt(p.count)}</span>
      </div>`
  }).join('')

  const verb = mode === 'add' ? 'added' : 'dropped'
  document.getElementById('safe').innerHTML = `
    <div class="xc" style="height:100%">
      <div class="xc-top">
        <span class="xc-mark">The League Beat</span>
        <span class="xc-league">Week ${wk}</span>
      </div>
      <div class="xc-rule"></div>
      <div class="tp-head">
        <div class="tp-chip">Week ${wk} · The wire</div>
        <div class="tp-title">The ten most<br><em>${esc(verb)}</em> players in fantasy</div>
        <div class="tp-sub">Leagues that ${esc(verb)} him in the last ${hours} hours — across every
          Sleeper league on earth.</div>
      </div>
      <div class="tp-rows">${body}</div>
      <div class="tp-foot">
        <span class="l">theleaguebeat.com</span>
        <span class="r">Your league, written up. Free.</span>
      </div>
    </div>`
}

async function loadXMnf() {
  const cfg = LEAGUES[params.get('lg') === 'ffl' ? 'ffl' : 'lor']
  await rankedTeams(cfg)                      // primes _prCache
  const [league, , , proj] = _prCache[cfg.id]
  const state = await fetch('https://api.sleeper.app/v1/state/nfl').then((r) => r.json())
  const wk = Number(params.get('wk') || state.week || 1)

  const sched = await fetch(
    `https://api.sleeper.app/schedule/nfl/regular/${league.season}`,
  ).then((r) => r.json())
  // Date-only strings parse as UTC midnight; getUTCDay is stable.
  const monday = sched.filter(
    (g) => g.week === wk && new Date(g.date).getUTCDay() === 1,
  )
  const gameByTeam = {}
  for (const g of monday) {
    gameByTeam[g.home] = `${g.away} @ ${g.home}`
    gameByTeam[g.away] = `${g.away} @ ${g.home}`
  }

  const players = proj
    .filter((r) => r.player?.team && gameByTeam[r.player.team])
    .map((r) => ({
      id: String(r.player_id),
      name: [r.player.first_name, r.player.last_name].filter(Boolean).join(' '),
      pos: r.player.position,
      game: gameByTeam[r.player.team],
      line: (r.stats?.pts_half_ppr ?? 0) / 17,
    }))
    .sort((a, b) => b.line - a.line)
    .slice(0, Number(params.get('rows') || 5))

  if (params.get('style') === 'bubbles') {
    const cols = players.map((p) => `
      <div class="mnfb-col">
        <div class="mnfb-bubble">
          <b>Need ${p.line.toFixed(1)}</b>
          <span>from ${esc(p.name)}</span>
        </div>
        <div class="mnfb-face"><img src="https://sleepercdn.com/content/nfl/players/${p.id}.jpg" alt=""
          onerror="this.remove()"></div>
        <div class="mnfb-game">${esc(p.game)} · ${esc(p.pos)}</div>
      </div>`).join('')
    document.getElementById('safe').innerHTML = xcShell({
      league: params.get('league') || 'Leagues everywhere',
      title: params.get('title') || 'What do you need to win tonight?',
      when: params.get('when') || `Week ${wk} · Monday night`,
      rows: `<div class="mnfb-grid">${cols}</div>`,
    })
    return
  }

  // The group chat. Dialogue is openly invented; the numbers are not.
  // No masthead: the artifact IS a chat screenshot, and branding on a
  // screenshot breaks the fiction. One dim domain line at the foot.
  document.body.dataset.ratio = params.get('ratio') || '4x5'
  const surname = (p) => p.name.split(' ').slice(1).join(' ') || p.name
  // Mahomes' manager, not Mahomes's.
  const poss = (p) => surname(p) + (surname(p).endsWith('s') ? '’' : '’s')
  const L = (p) => `<b>${p.line.toFixed(1)}</b>`
  const av = (p, cls = 'msg-av') => `<span class="${cls}"><img
    src="https://sleepercdn.com/content/nfl/players/${p.id}.jpg" alt="" onerror="this.remove()"></span>`

  // Four incoming, then YOURS — the most desperate message in the
  // thread is the one you sent. Then the whole league starts typing.
  const incoming = players.slice(0, 4)
  const you = players[4] || players[players.length - 1]
  const scripts = [
    (p) => `Need ${L(p)} from ${esc(p.name)} and I win the week`,
    (p) => `Down ${L(p)} with ${esc(surname(p))} still to play. Feeling weirdly calm`,
    (p) => `${esc(p.name)} owes me ${L(p)} by 11pm`,
    (p, prev) => `${prev.line.toFixed(1)}?? I only need ${L(p)} from ${esc(surname(p))}`,
  ]
  const msgs = incoming.map((p, i) => `
    <div class="msg">
      ${av(p)}
      <span class="msg-body">
        <div class="msg-from">${esc(poss(p))} manager</div>
        <div class="msg-bubble">${scripts[i % scripts.length](p, incoming[Math.max(0, i - 1)])}</div>
      </span>
    </div>`).join('')

  document.getElementById('safe').innerHTML = `
    <div class="chat-page">
      <div class="chat-eyebrow">Week ${wk} · Monday night</div>
      <div class="chat-title">${esc(params.get('title') || 'What do you need to win tonight?')}</div>
      <div class="chat">
        <div class="chat-when"><b>Monday</b> 7:58 PM · ${esc(you?.game || '')}</div>
        ${msgs}
        <div class="msg you">
          <span class="msg-body">
            <div class="msg-bubble">${L(you)} from ${esc(you.name)} or nobody text me tomorrow</div>
            <div class="msg-receipt">Delivered</div>
          </span>
        </div>
        <div class="msg">
          <span class="typing-avs">${incoming.slice(0, 3).map((p) => av(p)).join('')}</span>
          <span class="msg-body">
            <div class="msg-bubble msg-typing"><i></i><i></i><i></i></div>
          </span>
        </div>
      </div>
      <div class="chat-foot">theleaguebeat.com</div>
    </div>`
}

/**
 * The front page as a poster: the week's top headliner IS the cover.
 *
 *   ?view=x-cover&wk=1
 *   &h1=...  &deck=...   override the cover line when the story
 *                        deserves better words than the template
 */
async function loadXCover() {
  document.body.dataset.ratio = params.get('ratio') || '4x5'
  const cfg = LEAGUES[params.get('lg') === 'ffl' ? 'ffl' : 'lor']
  const wk = Number(params.get('wk') || 1)
  // NFL-wide by default: this is a marketing asset about the players
  // making front pages in leagues EVERYWHERE, not about our league.
  // &pool=league flips it back for a house-league edition.
  const pool = params.get('pool') || 'nfl'
  const [star, ...also] = await weekHeadliners(cfg, wk, 3, pool)

  if (params.get('zoom')) {
    document.documentElement.style.setProperty('--cov-zoom', params.get('zoom'))
  }

  const surname = star.name.split(' ').slice(1).join(' ') || star.name
  const h1 = params.get('h1')
    || (pool === 'league'
      ? `${surname} gave ${star.team.team} the week.`
      : `${surname} is somebody’s cover story.`)
  const deck = params.get('deck')
    || `+${star.diff.toFixed(1)} on the average starting ${star.pos}. ` +
       (pool === 'league'
         ? `The other nine teams are in here too.`
         : `If he’s rostered in your league, he just made your paper.`)

  const banner = params.get('banner')
    || 'Your league’s own magazine · New issue every week'

  document.getElementById('safe').innerHTML = `
    <div class="cov">
      <div class="cov-mast">
        <div class="cov-issue">${pool === 'league'
          ? `<span>${esc(cfg.name)}</span><b>Issue No. ${wk + 1}</b><span>Week ${wk}</span>`
          : `<span>Week ${wk}</span><b>The cover stories</b><span>Leagues everywhere</span>`}</div>
        <div class="word">The League Beat</div>
      </div>
      <div class="cov-hero">
        <img src="https://sleepercdn.com/content/nfl/players/${star.id}.jpg" alt="">
      </div>
      <div class="cov-grain"></div>
      ${also.map((p, i) => `
        <div class="cov-tease ${i === 0 ? 'left' : 'right'}">
          <span class="cov-tease-face"><img src="https://sleepercdn.com/content/nfl/players/${p.id}.jpg" alt="" onerror="this.remove()"></span>
          <span class="cov-tease-copy"><b>${esc(p.name)}</b><span>+${p.diff.toFixed(1)} over the field</span></span>
        </div>`).join('')}
      <div class="cov-lines">
        <div class="cov-kicker">The cover story</div>
        <div class="cov-head">${esc(h1)}</div>
        <div class="cov-deck">${esc(deck)}</div>
      </div>
      <div class="cov-banner"><span>${esc(banner)}</span></div>
      <div class="cov-foot">
        <span class="site">theleaguebeat.com</span>
        <span class="cov-code"><span class="bars"></span><span class="price">FREE</span></span>
      </div>
    </div>`
}

/* ── The site's power board, ported ───────────────────────────────
   These cards sit beside the issue, so they must not compute a
   DIFFERENT ranking from it. This mirrors editorial/points/powerScore
   exactly: all-play .35, scoring .25, record .20, recent .20, blended
   with what the roster projects at max(0.25, 1/(1+weeks)) — an even
   split in week one, settling to a quarter by week three.

   If that file changes, this changes with it. A graphic and a page
   disagreeing about who is first is the drift this whole layer exists
   to prevent. */
const PW = { allPlay: 0.35, scoring: 0.25, record: 0.20, recent: 0.20 }
const RECENT_WEEKS = 3
const clamp01 = (n) => (Number.isFinite(n) ? Math.min(1, Math.max(0, n)) : 0)
const pct = (w, l, t) => (w + l + t <= 0 ? 0.5 : (w + t / 2) / (w + l + t))

function allPlayFrom(scores, keep) {
  const byWeek = new Map()
  for (const s of scores) {
    if (keep && !keep(s.week)) continue
    const list = byWeek.get(s.week) ?? []
    list.push(s)
    byWeek.set(s.week, list)
  }
  const out = new Map()
  for (const list of byWeek.values()) {
    for (const a of list) {
      const row = out.get(a.teamId) ?? { wins: 0, losses: 0, ties: 0 }
      out.set(a.teamId, row)
      for (const b of list) {
        if (b.teamId === a.teamId) continue
        if (a.points > b.points) row.wins++
        else if (a.points < b.points) row.losses++
        else row.ties++
      }
    }
  }
  return out
}

/**
 * The board for a league, matching the site.
 *
 * `weeklyScores` counts CLOSED weeks only. Sleeper's league `leg` lags
 * — it still read 1 on the Tuesday after week one, with every result
 * final — so completed weeks come from the rosters' own records, which
 * are written by the same event that closes a week.
 */
/**
 * The preseason ranking AS PUBLISHED, per league.
 *
 * WHY THIS IS HARDCODED. Week two's arrows have to measure from the
 * board a viewer actually saw, and what they saw was the preseason
 * countdown video — which ranked by playoff odds from the simulated
 * seasons, not by roster projection. Those are different measures and
 * they disagree: Black Panther was 6th on the video and 12th on the
 * projection board, so an arrow drawn from the projection said "up
 * two" about a team that had in fact fallen four.
 *
 * Recomputing the odds here is not an option — they came from 200,000
 * simulated seasons run offline. So the published order is written
 * down, exactly as it went out on 8 Sept.
 *
 * Dynasty Champs has no entry because it never had a preseason video;
 * it falls back to the projection board, which is the only earlier
 * ranking that league has.
 *
 * Matched on team name, which is what the video said out loud. A team
 * that has renamed since simply gets no arrow rather than a wrong one.
 */
const PRESEASON = {
  lor: [
    'The Aman-Ra Stars', 'Mighty Mallards', 'Scuttlebucs', 'Gridiron Man',
    'Chancla Warriors', 'The Juggernauts', 'Pigskin Prophtz', 'OverDrive',
    'East Coast Enforcers', 'Game of Throws',
  ],
  ffl: [
    'UCDUST', '🦅Go Birds🦅', 'Dom perignons', 'Aggresive Chickens',
    'The Jabariz', 'Black Panther', 'HazeHunters', 'Cabuloso Pats',
    'StreetGliders', 'HawkForceOne', 'Zenyatta', 'Primetime Primates',
  ],
}

/**
 * The line under a team name: how far they have moved since last week.
 *
 * WHAT "LAST WEEK" MEANS IN WEEK TWO. There is no earlier results
 * board to diff against — this is the first one of the season. But
 * there WAS a board last week: the preseason one, teams ordered by
 * what their roster projected. That is what a reader saw, so that is
 * what the movement is measured from, and it is what the site falls
 * back to to draw the same arrows.
 *
 * From week three the prior board is the real thing — the same
 * formula run on the weeks before this one — and this fallback stops
 * being used.
 */
function movementOf(row, ctx) {
  const prior = ctx.priorRank?.get(row.teamId)
  if (prior === undefined) return { dir: 'flat', text: '' }
  const d = prior - row.rank
  if (d === 0) return { dir: 'flat', text: 'No change from last week' }
  return { dir: d > 0 ? 'up' : 'down', text: `${d > 0 ? '▲' : '▼'} ${Math.abs(d)} from last week` }
}

async function powerBoard(cfg) {
  const table = await rankedTeams(cfg)            // also primes _prCache
  const [league, rosters, users] = _prCache[cfg.id]
  const decided = rosters.reduce(
    (t, r) => t + (r.settings?.wins ?? 0) + (r.settings?.losses ?? 0) + (r.settings?.ties ?? 0), 0)
  const closedWeeks = rosters.length ? Math.floor(decided / rosters.length) : 0
  if (closedWeeks < 1) return { rows: [], closedWeeks: 0, results: new Map() }

  const weeks = await Promise.all(
    Array.from({ length: closedWeeks }, (_, i) =>
      fetch(`https://api.sleeper.app/v1/league/${cfg.id}/matchups/${i + 1}`).then((r) => r.json())),
  )
  const scores = []
  const results = new Map()          // teamId -> last closed week's game
  weeks.forEach((ms, i) => {
    const wk = i + 1
    for (const m of ms) scores.push({ teamId: String(m.roster_id), week: wk, points: m.points ?? 0 })
    if (wk !== closedWeeks) return
    const groups = {}
    for (const m of ms) { if (m.matchup_id == null) continue; (groups[m.matchup_id] ||= []).push(m) }
    for (const pair of Object.values(groups)) {
      if (pair.length !== 2) continue
      const [a, b] = pair
      const [w, l] = (a.points ?? 0) >= (b.points ?? 0) ? [a, b] : [b, a]
      results.set(String(w.roster_id), { won: true, own: w.points ?? 0, opp: l.points ?? 0, oppId: String(l.roster_id) })
      results.set(String(l.roster_id), { won: false, own: l.points ?? 0, opp: w.points ?? 0, oppId: String(w.roster_id) })
    }
  })

  const played = [...new Set(scores.map((s) => s.week))].sort((a, b) => a - b)
  const cutoff = played[Math.max(0, played.length - RECENT_WEEKS)]
  const ap = allPlayFrom(scores)
  const rp = allPlayFrom(scores, (w) => w >= cutoff)

  const meanOf = new Map()
  for (const id of new Set(scores.map((s) => s.teamId))) {
    const mine = scores.filter((s) => s.teamId === id)
    meanOf.set(id, mine.reduce((t, s) => t + s.points, 0) / mine.length)
  }
  const means = [...meanOf.values()]
  const leagueMean = means.reduce((t, m) => t + m, 0) / means.length
  const stdev = Math.sqrt(means.reduce((t, m) => t + (m - leagueMean) ** 2, 0) / means.length)

  /* ── What the current roster projects ──────────────────────────
     The other half of the board, and the same half the site uses: a
     week-two ranking built only on week one is a ranking of one game.
     Its weight decays as results arrive — half at one week played,
     down to a quarter — which is why the page says the projection is
     carrying most of this early and results take over.

     Normalised min-max across the field, matching the site. */
  const projOf = new Map(table.map((t) => [t.owner, t.perWeek]))
  const ownerOf = new Map(rosters.map((r) => [String(r.roster_id), r.owner_id]))
  const projValues = rosters.map((r) => projOf.get(r.owner_id)).filter(Number.isFinite)
  const pLo = Math.min(...projValues), pHi = Math.max(...projValues)
  const projWeight = Math.max(0.25, 1 / (1 + closedWeeks))

  const byId = Object.fromEntries(users.map((u) => [u.user_id, u]))
  const rows = rosters.map((r) => {
    const id = String(r.roster_id)
    const a = ap.get(id) ?? { wins: 0, losses: 0, ties: 0 }
    const rr = rp.get(id) ?? a
    const mean = meanOf.get(id) ?? 0
    const scoring = stdev > 0 ? clamp01(0.5 + (mean - leagueMean) / (4 * stdev)) : 0.5
    const w = r.settings?.wins ?? 0, l = r.settings?.losses ?? 0, t = r.settings?.ties ?? 0
    const record = w + l + t > 0 ? clamp01((w + t / 2) / (w + l + t)) : pct(a.wins, a.losses, a.ties)
    const fromResults =
      PW.allPlay * pct(a.wins, a.losses, a.ties) + PW.scoring * scoring +
      PW.record * record + PW.recent * pct(rr.wins, rr.losses, rr.ties)
    // Branch rather than weight by zero: `0 * undefined` is NaN, which
    // clamps to 0 and flattens the whole board.
    const raw = projOf.get(ownerOf.get(id))
    const proj = pHi > pLo && Number.isFinite(raw) ? clamp01((raw - pLo) / (pHi - pLo)) : undefined
    const blend = proj === undefined ? fromResults
      : (1 - projWeight) * fromResults + projWeight * proj
    const u = byId[r.owner_id] || {}
    const md = u.metadata || {}
    return {
      teamId: id,
      ownerId: r.owner_id,
      // NEVER `display_name` — that is a Sleeper username, and these
      // plates get posted. A team without a set name gets a number.
      team: (md.team_name || `Team ${r.roster_id}`).trim(),
      avatar: md.avatar || (u.avatar ? `https://sleepercdn.com/avatars/${u.avatar}` : null),
      score: Math.round(clamp01(blend) * 1000) / 10,
      allPlay: `${a.wins}-${a.losses}`,
      record: `${w}-${l}${t ? `-${t}` : ''}`,
      perWeek: Math.round(mean * 10) / 10,
    }
  }).sort((x, y) => y.score - x.score)
  rows.forEach((r, i) => { r.rank = i + 1 })

  /* ── Where they stood before this week ──────────────────────────
     Same formula on the weeks up to but not including the last one.
     With a single closed week there is no such board, and `priorRank`
     stays undefined so the movement line falls back to last season. */
  let priorRank
  if (closedWeeks >= 2) {
    const before = scores.filter((s) => s.week < closedWeeks)
    const bap = allPlayFrom(before)
    const bplayed = [...new Set(before.map((s) => s.week))].sort((a, b) => a - b)
    const bcut = bplayed[Math.max(0, bplayed.length - RECENT_WEEKS)]
    const brp = allPlayFrom(before, (w) => w >= bcut)
    const bmean = new Map()
    for (const id of new Set(before.map((s) => s.teamId))) {
      const mine = before.filter((s) => s.teamId === id)
      bmean.set(id, mine.reduce((t, s) => t + s.points, 0) / mine.length)
    }
    const bm = [...bmean.values()]
    const bLeague = bm.reduce((t, m) => t + m, 0) / bm.length
    const bStd = Math.sqrt(bm.reduce((t, m) => t + (m - bLeague) ** 2, 0) / bm.length)
    const prior = rosters.map((r) => {
      const id = String(r.roster_id)
      const a = bap.get(id) ?? { wins: 0, losses: 0, ties: 0 }
      const rr = brp.get(id) ?? a
      const mean = bmean.get(id) ?? 0
      const sc = bStd > 0 ? clamp01(0.5 + (mean - bLeague) / (4 * bStd)) : 0.5
      // Head-to-head record as it stood then, from the weeks played —
      // `roster.settings.wins` is today's and would leak this week in.
      const rec = pct(a.wins, a.losses, a.ties)
      const res = PW.allPlay * pct(a.wins, a.losses, a.ties) + PW.scoring * sc +
                  PW.record * rec + PW.recent * pct(rr.wins, rr.losses, rr.ties)
      // Same blend, at the weight that applied THEN — comparing a
      // blended board against a results-only one would report movement
      // that is really just a change of model.
      const pw = Math.max(0.25, 1 / (1 + (closedWeeks - 1)))
      const raw = projOf.get(r.owner_id)
      const pj = pHi > pLo && Number.isFinite(raw) ? clamp01((raw - pLo) / (pHi - pLo)) : undefined
      return { id, score: pj === undefined ? res : (1 - pw) * res + pw * pj }
    }).sort((x, y) => y.score - x.score)
    priorRank = new Map(prior.map((p, i) => [p.id, i + 1]))
  }

  // Week two has no earlier RESULTS board. The published preseason
  // countdown stands in where there was one, because that is the
  // ranking a viewer is comparing against; otherwise the projection
  // board, which is what the site falls back to.
  if (!priorRank) {
    const published = PRESEASON[Object.keys(LEAGUES).find((k) => LEAGUES[k] === cfg)]
    if (published) {
      const seat = new Map(published.map((name, i) => [name, i + 1]))
      priorRank = new Map(rows.map((r) => [r.teamId, seat.get(r.team)])
        .filter(([, v]) => v !== undefined))
    } else {
      const seat = new Map(table.map((t, i) => [t.owner, i + 1]))
      priorRank = new Map(rosters.map((r) => [String(r.roster_id), seat.get(r.owner_id)])
        .filter(([, v]) => v !== undefined))
    }
  }

  const ctx = { priorRank }
  for (const r of rows) r.move = movementOf(r, ctx)
  return {
    rows, closedWeeks, results,
    nameOf: new Map(rows.map((r) => [r.teamId, r.team])),
  }
}

/**
 * The Week N countdown: an opening plate, then one card per team,
 * worst first.
 *
 *   ?view=wk-intro&lg=lor|ffl|dc&wk=2   the plate
 *   ?view=wk-rank&lg=lor&n=1            one card, n counting UP from last
 *   ?view=wk-sheet&lg=lor               all of them stacked, for export
 *
 * `n` counts up from last place because that is the order these get
 * revealed. The rank printed on the card is the real one.
 */
function wkIntroHtml(cfg, wk) {
  // The Drop Zone League has no crest of its own — it is the ladder
  // between the two, and the title card has always said so with both.
  const mark = cfg.pair
    ? `<div class="wk-intro-pair">
         <img src="${esc(LEAGUES.lor.crest)}" alt="">
         <div class="wk-intro-ladder"><span class="dn">▼ 2 down</span><span class="up">2 up ▲</span></div>
         <img src="${esc(LEAGUES.ffl.crest)}" alt="">
       </div>`
    : `<img class="wk-intro-crest" src="${esc(cfg.crest)}" alt="">`
  return `
    <div class="wk-intro">
      <div>
        ${mark}
        <div class="wk-intro-league">${esc(cfg.name)}</div>
        <div class="wk-intro-title">Week ${wk}<em>Power rankings</em></div>
      </div>
    </div>`
}

function wkRankHtml(cfg, wk, board, n) {
  const row = board.rows[board.rows.length - n]
  if (!row) return `<div class="err">No team at ${n} from bottom.</div>`

  // Last week's game, drawn the way the Monday desk draws one.
  const last = board.results.get(row.teamId)
  const oppName = last ? board.nameOf.get(last.oppId) ?? 'their opponent' : ''
  const lastHtml = last
    ? `<div class="wk-last">
         <span class="wk-last-tag ${last.won ? 'won' : 'lost'}">${last.won ? 'Won' : 'Lost'}</span>
         <span class="wk-last-copy">${last.won ? 'beat' : 'lost to'} ${esc(oppName)}</span>
         <span class="wk-last-score">${last.own.toFixed(1)} – ${last.opp.toFixed(1)}</span>
       </div>`
    : ''

  return `
    <div class="wk">
      <div class="wk-top">
        <span>${esc(cfg.name)}</span>
        <span><b>Week ${wk}</b> · Power rankings</span>
      </div>
      <div class="wk-body">
        <div class="wk-rank">${row.rank}</div>
        <div class="wk-main">
          <div class="wk-id">
            <span class="wk-crest">${row.avatar
              ? `<img src="${esc(row.avatar)}" alt="">`
              : esc(initials(row.team))}</span>
            <div>
              <div class="wk-team">${esc(row.team)}</div>
              <div class="wk-move ${row.move.dir}">${esc(row.move.text)}</div>
            </div>
          </div>
          <div class="wk-stats">
            <span class="wk-stat"><b>${row.score}</b><i>power score</i></span>
            <span class="wk-stat"><b>${row.allPlay}</b><i>all-play</i></span>
            <span class="wk-stat"><b>${row.perWeek}</b><i>points a week</i></span>
            <span class="wk-stat"><b>${row.record}</b><i>record</i></span>
          </div>
          ${lastHtml}
        </div>
      </div>
      <div class="wk-foot">
        <span>theleaguebeat.com</span><span class="free">Free for your league</span>
      </div>
    </div>`
}

const wkCfg = () => LEAGUES[params.get('lg')] ?? LEAGUES.lor
const wkWeek = () => Number(params.get('wk') || 2)

async function loadWkIntro() {
  document.getElementById('safe').innerHTML = wkIntroHtml(wkCfg(), wkWeek())
}

async function loadWkRank() {
  const cfg = wkCfg()
  const board = await powerBoard(cfg)
  document.getElementById('safe').innerHTML = board.rows.length
    ? wkRankHtml(cfg, wkWeek(), board, Number(params.get('n') || 1))
    : '<div class="err">No completed week yet, so there is no board to count down.</div>'
}

/**
 * Every plate for one league, stacked.
 *
 * WHY A SHEET EXISTS. Capturing these one URL at a time is a navigate
 * and a screenshot per team — thirty-odd round trips for three
 * leagues, each one a chance to catch a card mid-fetch. Stacked, the
 * whole countdown is one render and one capture, then sliced into
 * frames. Same markup as the single views, so they cannot drift.
 */
async function loadWkSheet() {
  const cfg = wkCfg()
  const wk = wkWeek()
  const plate = (inner) => `<div class="frame"><div class="safe">${inner}</div></div>`
  const cards = [plate(wkIntroHtml(cfg, wk))]
  // The umbrella has no league id and so no board — its sheet is the
  // opening plate alone.
  if (!cfg.pair) {
    const board = await powerBoard(cfg)
    if (board.rows.length === 0) {
      document.getElementById('safe').innerHTML = '<div class="err">No completed week yet.</div>'
      return
    }
    for (let n = 1; n <= board.rows.length; n++) cards.push(plate(wkRankHtml(cfg, wk, board, n)))
  }
  // A thirteen-frame sheet is 17,550px tall and Chrome times out
  // capturing it. `&from=&to=` (1-based, inclusive) takes it in passes.
  const from = Number(params.get('from') || 1)
  const to = Number(params.get('to') || cards.length)
  const shown = cards.slice(from - 1, to)
  const shell = document.getElementById('shell')
  shell.innerHTML = shown.join('')
  document.body.dataset.sheet = String(shown.length)

  // ZOOM THE SHEET TO THE WINDOW, don't let the window shrink the
  // sheet. A capture is taken at `innerWidth × devicePixelRatio`
  // physical pixels; on a window wider than 1920 CSS px the frames
  // land short of that and the slices come out soft. `zoom` (not
  // `transform`) because it changes layout too, so the page height
  // still matches what is drawn and a full-page capture cuts clean.
  shell.style.zoom = String(window.innerWidth / 1920)
}

function fit() {
  // The sheet is many frames at 1:1; there is nothing to scale.
  if (document.body.dataset.sheet) return
  const f = document.getElementById('frame')
  if (exporting) {
    const s = Math.min(1, window.innerWidth / f.offsetWidth)
    f.style.transform = `scale(${s})`
    const shell = document.getElementById('shell')
    shell.style.width = `${f.offsetWidth * s}px`
    shell.style.height = `${f.offsetHeight * s}px`
    return
  }
  const scale = Math.min(1, window.innerWidth / f.offsetWidth, window.innerHeight / f.offsetHeight)
  f.style.transform = `translate(-50%, -50%) scale(${scale})`
  document.getElementById('hint').textContent =
    `${f.offsetWidth}x${f.offsetHeight} @ ${(scale * 100).toFixed(0)}%  ·  ?view=rank&n=1..10 | lor|ffl|honours|seasons|title|down|up|champ  ·  X: x-rank|x-odds|x-record  ?ratio=16x9  ?export`
}

;(async () => {
  try {
    if (view === 'honours') await loadHonours()
    else if (view === 'seasons') await loadSeasons()
    else if (view === 'ranks') await loadRanks()
    else if (view === 'rank') await loadRank()
    else if (view === 'title') loadTitle()
    else if (view === 'intro') loadIntro()
    else if (view === 'group') await loadGroup()
    else if (view === 'down' || view === 'up') loadSolo(view)
    else if (view === 'x-hero') await loadXHero()
    else if (view === 'x-rank') await loadXRank()
    else if (view === 'x-odds') await loadXOdds()
    else if (view === 'x-record') await loadXRecord()
    else if (view === 'x-race') await loadXRace()
    else if (view === 'x-matchups') await loadXMatchups()
    else if (view === 'x-headliners') await loadXHeadliners()
    else if (view === 'x-duds') await loadXDuds()
    else if (view === 'x-cover') await loadXCover()
    else if (view === 'x-mnf') await loadXMnf()
    else if (view === 'x-top') await loadXTop()
    else if (view === 'x-wire-nfl') await loadXWireNfl()
    else if (view === 'x-device') await loadXDevice()
    else if (view === 'wk-intro') await loadWkIntro()
    else if (view === 'wk-rank') await loadWkRank()
    else if (view === 'wk-sheet') await loadWkSheet()
    else if (view === 'champ') await loadChamp()
    else await loadLeague(view in LEAGUES ? view : 'lor')
  } catch (e) {
    document.getElementById('safe').innerHTML =
      `<div class="err">Couldn't reach Sleeper.<br><small>${esc(e.message)}</small></div>`
  }
  addEventListener('resize', fit)
  document.fonts.ready.then(fit)
  fit()
})()
</script>
