<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League cards — The League Beat</title>
<!--
  Full-screen vertical cards for video: who is in each league, and who has
  actually won this thing.

    ?view=lor        League of Record, by division
    ?view=ffl        Futures Football League
    ?view=honours    Champions, 2019 onward
    ?ratio=16x9      widescreen cut of any of the above
    ?export          renders 1:1 for a clean full-page capture

  X CARDS (1920x1080, already widescreen, no ?ratio needed):

    ?view=x-rank     the board, ranked by expected weekly points
    ?view=x-odds     playoff odds, with the race drawn as a bar
    ?view=x-record   all-time records, dated "through 2025"
    &lg=ffl          second tier (x-rank and x-odds)
    &rows=6          how many rows; six is what reads in a timeline

  ROSTERS ARE FETCHED LIVE from Sleeper's public API. Team names change
  constantly — mid-season, after a bad week, for a joke — and a graphic
  with last month's names in it is worse than no graphic. The endpoints
  are public and unauthenticated, and the app already reads them from the
  browser, so there is nothing to proxy.

  CHAMPIONS ARE BAKED IN. Working them out live costs three requests per
  season and they cannot change: the bracket for 2021 is settled forever.

  NO USERNAMES, ANYWHERE — not on screen, not in this file. Teams are
  identified by their FRANCHISE name only.

  Champions are keyed on the owner id, an opaque API key rather than a
  name, because one manager won in both 2019 and 2021 under two
  different team names. Keyed on team name that reads as two separate
  one-time winners and loses a two-time champion; keyed on owner and
  resolved to the franchise they run TODAY, the repeat shows and nobody
  is named.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: oklch(0.97 0.005 90); --muted: oklch(0.62 0.01 90); --dim: oklch(0.48 0.01 90);
    --bg: oklch(0.09 0.014 90); --panel: oklch(0.15 0.012 90); --line: oklch(0.26 0.02 90);
    --gold: oklch(0.85 0.17 92); --pink: oklch(0.70 0.27 350);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #000;
    font-family: 'Barlow', system-ui, sans-serif;
    display: grid; place-items: center; overflow: hidden;
  }
  .frame {
    width: 1080px; height: 1920px; flex: none;
    position: fixed; left: 50%; top: 50%;
    transform-origin: center;
    background:
      radial-gradient(120% 60% at 50% 0%, oklch(0.18 0.035 92 / 0.5), transparent 62%),
      var(--bg);
    color: var(--ink);
  }
  body[data-ratio="16x9"] .frame { width: 1920px; height: 1080px; }

  /* Taller than the ground-rules card: a full roster is the content, not
     an overlay, so it uses more of the screen. Still clear of the caption
     strip at the bottom and the button rail on the right. */
  .safe {
    position: absolute; left: 5.5%; top: 7%; width: 83%; height: 81%;
    display: flex; flex-direction: column;
  }
  body[data-ratio="16x9"] .safe { left: 6%; top: 7%; width: 88%; height: 84%; }

  /* ── Header ───────────────────────────────────────────────── */
  .head { display: flex; align-items: center; gap: 28px; margin-bottom: 30px; }
  .crest {
    width: 168px; height: 168px; object-fit: contain; flex: none;
    border-radius: 20px;  /* the logo files carry their own cream ground */
  }
  body[data-ratio="16x9"] .crest { width: 130px; height: 130px; }
  .head-copy { min-width: 0; }
  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--pink); margin-bottom: 4px;
  }
  h1 { margin: 0; font-size: 68px; font-weight: 900; line-height: 0.95; letter-spacing: -0.03em; }
  body[data-ratio="16x9"] h1 { font-size: 56px; }
  .sub { font-size: 26px; color: var(--muted); margin-top: 8px; }

  /* ── Team list ────────────────────────────────────────────── */
  .divhead {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold);
    margin: 22px 0 12px; display: flex; align-items: center; gap: 14px;
  }
  .divhead::after { content: ''; flex: 1; height: 2px; background: var(--line); }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li {
    display: flex; align-items: center; gap: 20px;
    background: var(--panel); border: 2px solid transparent;
    border-radius: 16px; padding: 12px 20px;
  }
  li[data-champ] { border-color: oklch(0.42 0.10 92); background: linear-gradient(90deg, oklch(0.20 0.045 92 / 0.7), var(--panel) 55%); }
  .av {
    width: 72px; height: 72px; border-radius: 14px; flex: none; overflow: hidden;
    background: oklch(0.24 0.02 90); display: grid; place-items: center;
    font-weight: 800; font-size: 24px; color: var(--muted);
  }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  /* Spans, so they must be told to stack — inline by default put the
     the second line sat alongside the first, overlapping it. */
  .names { min-width: 0; flex: 1; }
  .names > span { display: block; }
  .tname {
    font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cups { display: flex; gap: 6px; flex: none; align-items: center; }
  .cup { font-size: 30px; line-height: 1; filter: saturate(1.2); }
  .cupn {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px;
    color: var(--gold); letter-spacing: 0.08em;
  }

  /* Two columns when a list runs long in widescreen. */
  body[data-ratio="16x9"] .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 34px; align-items: start; }

  /* ── Title card ───────────────────────────────────────────── */
  .title-wrap { display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 40px; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  /* The gap between the crests IS the idea — one league sits above the
     other, and the arrows between them are the whole format. */
  .stack img { width: 300px; height: 300px; object-fit: contain; border-radius: 34px; }
  .stack .between {
    display: flex; align-items: center; gap: 26px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
    font-size: 30px; letter-spacing: 0.2em; text-transform: uppercase;
  }
  .stack .between .dn { color: oklch(0.72 0.19 40); }
  .stack .between .up { color: oklch(0.78 0.17 145); }
  .stack .between i { font-style: normal; opacity: 0.35; }
  .big-title {
    text-align: center; font-size: 104px; font-weight: 900;
    line-height: 0.92; letter-spacing: -0.035em; margin: 0;
  }
  .big-sub { text-align: center; font-size: 32px; color: var(--muted); margin-top: 14px; }

  /* ── Intro card: the frame a countdown opens on ───────────── */
  .intro {
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; height: 100%; text-align: center;
  }
  .intro-crest {
    width: 340px; height: 340px; object-fit: contain;
    border-radius: 42px; margin-bottom: 56px;
  }
  .intro-league {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 31px;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--pink);
    margin-bottom: 24px;
  }
  .intro-title {
    font-size: 128px; font-weight: 900; line-height: 0.86;
    letter-spacing: -0.04em; margin: 0;
  }
  .intro-season {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 54px;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--gold);
    margin-top: 34px;
  }
  .intro-foot {
    width: 640px; margin-top: 52px; padding-top: 28px;
    border-top: 2px solid var(--line);
    font-size: 30px; color: var(--muted);
  }

  /* ── Grouped reveal: three teams, top of frame ─────────────
     Everything sits in the upper half. The bottom of the vertical is
     left empty on purpose — that is where the person talking goes, and
     the export fades this to transparent so it can sit over footage. */
  .grp { padding-top: 26px; }
  .grp-eyebrow {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 27px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--pink);
    margin-bottom: 40px;
  }
  .grp-rows { display: flex; flex-direction: column; gap: 42px; }
  .grp-row { display: flex; align-items: center; gap: 32px; }
  .grp-rank {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 140px;
    line-height: 0.8; color: var(--gold); flex: none;
    width: 164px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .grp-crest {
    width: 172px; height: 172px; flex: none; border-radius: 36px; overflow: hidden;
    background: oklch(0.22 0.02 90); display: grid; place-items: center;
    font-weight: 900; font-size: 46px;
  }
  .grp-crest img { width: 100%; height: 100%; object-fit: cover; }
  .grp-id { min-width: 0; flex: 1; }
  .grp-name {
    display: block; font-size: 62px; font-weight: 900; line-height: 1;
    letter-spacing: -0.025em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* One line, always — a wrapped subtitle makes the three rows uneven. */
  .grp-last {
    display: block; font-size: 31px; color: var(--muted); margin-top: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* The number one reveal gets the whole top half to itself. */
  .grp[data-solo] .grp-rank { font-size: 190px; width: 210px; }
  .grp[data-solo] .grp-crest { width: 230px; height: 230px; border-radius: 46px; }
  .grp[data-solo] .grp-name { font-size: 76px; white-space: normal; }
  .grp[data-solo] .grp-last { font-size: 36px; margin-top: 18px; }

  /* ── A single rule, alone on the screen ───────────────────── */
  .solo { display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 34px; }
  .solo-arrow { font-size: 190px; line-height: 0.8; }
  .solo-head { font-size: 128px; font-weight: 900; line-height: 0.9; letter-spacing: -0.04em; }
  .solo-body { font-size: 42px; line-height: 1.3; color: oklch(0.84 0.01 90); max-width: 20ch; }
  .solo[data-dir="down"] .solo-arrow, .solo[data-dir="down"] .solo-head { color: oklch(0.72 0.19 40); }
  .solo[data-dir="up"] .solo-arrow, .solo[data-dir="up"] .solo-head { color: oklch(0.78 0.17 145); }

  /* ── One franchise, alone ─────────────────────────────────── */
  .spot { display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 30px; align-items: flex-start; }
  .spot-av {
    width: 340px; height: 340px; border-radius: 44px; overflow: hidden;
    background: oklch(0.24 0.02 90); display: grid; place-items: center;
    font-weight: 900; font-size: 96px; color: var(--muted);
    border: 3px solid oklch(0.42 0.10 92);
  }
  .spot-av img { width: 100%; height: 100%; object-fit: cover; }
  .spot-cups { font-size: 74px; letter-spacing: 8px; }
  .spot-name { font-size: 92px; font-weight: 900; line-height: 0.95; letter-spacing: -0.03em; }
  .spot-line { font-size: 40px; line-height: 1.3; color: oklch(0.84 0.01 90); max-width: 22ch; }
  .spot-tag {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: oklch(0.72 0.19 40); border: 2px solid oklch(0.45 0.13 40);
    padding: 10px 22px; border-radius: 999px; align-self: flex-start;
  }

  /* Strip mode: ten full-size frames in a column, for one capture. */
  body[data-strip] .strip { display: flex; flex-direction: column; }
  body[data-strip] .strip-frame {
    position: relative; width: 1080px; height: 1920px; transform: none;
    background: radial-gradient(120% 60% at 50% 0%, oklch(0.18 0.035 92 / 0.5), transparent 62%), var(--bg);
  }
  body[data-strip] .strip-frame .safe {
    position: absolute; left: 5.5%; top: 7%; width: 83%; height: 81%;
    display: flex; flex-direction: column;
  }
  body[data-strip] { display: block; width: 1080px; }
  body[data-strip] .hint { display: none; }

  /* ── Power-ranking countdown card ─────────────────────────── */
  .pr-head { display: flex; align-items: center; gap: 26px; margin-bottom: 22px; }
  .pr-rank {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 150px; line-height: 0.78; letter-spacing: -0.05em;
    color: var(--gold); flex: none;
  }
  .pr-rank small {
    display: block; font-size: 22px; letter-spacing: 0.18em;
    color: var(--muted); margin-top: 8px;
  }
  .pr-crest {
    width: 150px; height: 150px; border-radius: 26px; flex: none;
    overflow: hidden; background: oklch(0.22 0.02 90);
    display: grid; place-items: center; font-weight: 900; font-size: 44px;
  }
  .pr-crest img { width: 100%; height: 100%; object-fit: cover; }
  .pr-id { min-width: 0; flex: 1; }
  .pr-name {
    font-size: 62px; font-weight: 900; line-height: 0.98;
    letter-spacing: -0.03em; margin-bottom: 8px;
  }
  .pr-proj { font-size: 26px; color: var(--muted); }
  .pr-proj b { color: var(--gold); font-size: 34px; font-family: 'Barlow Condensed', sans-serif; }

  /* Season odds. The point total says how good the roster is; these say
     what it is likely to get, which is the thing the league argues about. */
  .pr-odds {
    display: flex; gap: 14px; margin: 20px 0 4px;
  }
  .pr-odds span {
    flex: 1; padding: 14px 20px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line);
    font-size: 23px; color: var(--muted); line-height: 1.25;
  }
  .pr-odds b {
    display: block; font-family: 'Barlow Condensed', sans-serif;
    font-size: 46px; font-weight: 900; color: #fff;
    letter-spacing: -0.01em; margin-bottom: 2px;
  }
  .pr-odds span:last-child b { color: var(--pink); }

  .pr-slots-label {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--pink);
    margin: 6px 0 12px; display: flex; align-items: center; gap: 14px;
  }
  .pr-slots-label em {
    font-family: system-ui, sans-serif; font-style: normal; font-weight: 500;
    font-size: 21px; letter-spacing: 0; text-transform: none; color: var(--dim);
  }
  .pr-slots-label::after { content: ''; flex: 1; height: 2px; background: var(--line); }
  .pr-slots { display: flex; flex-direction: column; gap: 12px; }
  .pr-slot {
    display: flex; align-items: center; gap: 16px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px 20px 12px 0;
  }
  .pr-pos {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 21px;
    letter-spacing: 0.1em; color: var(--muted);
    width: 74px; flex: none; text-align: center;
    border-right: 1px solid var(--line);
  }
  .pr-slot[data-flex] .pr-pos { color: oklch(0.72 0.14 250); }
  /* Sleeper headshots are 350×254 with the player centred and the head high
     in the frame, so a straight centre crop cuts the forehead off. */
  .pr-face {
    width: 72px; height: 72px; flex: none; border-radius: 50%; overflow: hidden;
    background: oklch(0.24 0.02 90); margin-left: -2px;
  }
  .pr-face img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; }
  .pr-player { flex: 1; min-width: 0; font-size: 33px; font-weight: 750;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-pts { flex: none; font-size: 29px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pr-note {
    margin-top: 18px; padding-left: 16px; border-left: 3px solid var(--line);
    font-size: 24px; line-height: 1.4; color: var(--dim);
  }

  /* ── Honours: franchises ranked by titles ─────────────────── */
  .champs { display: flex; flex-direction: column; gap: 16px; }
  .champ-row {
    display: flex; align-items: center; gap: 26px;
    background: var(--panel); border: 2px solid transparent;
    border-radius: 20px; padding: 20px 26px;
  }
  .champ-row[data-multi] {
    border-color: oklch(0.45 0.11 92);
    background: linear-gradient(90deg, oklch(0.21 0.05 92 / 0.75), var(--panel) 60%);
  }
  .champ-av {
    width: 110px; height: 110px; border-radius: 20px; flex: none; overflow: hidden;
    background: oklch(0.24 0.02 90); display: grid; place-items: center;
    font-weight: 800; font-size: 34px; color: var(--muted);
  }
  .champ-av img { width: 100%; height: 100%; object-fit: cover; }
  .champ-copy { flex: 1; min-width: 0; }
  /* Spans stack only when told to — otherwise the years run into the
     end of the team name. */
  .champ-copy > span { display: block; }
  .champ-name {
    font-size: 44px; font-weight: 900; line-height: 1.05; letter-spacing: -0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .champ-years { font-size: 24px; color: var(--dim); margin-top: 6px; }
  .champ-cups { flex: none; display: flex; gap: 4px; font-size: 44px; line-height: 1; }

  /* ── Honours board ────────────────────────────────────────── */
  .years { display: flex; flex-direction: column; gap: 12px; }
  .yr { display: flex; align-items: center; gap: 22px; padding: 14px 20px;
        background: var(--panel); border-radius: 16px; border: 2px solid transparent; }
  .yr[data-repeat] { border-color: oklch(0.42 0.10 92); }
  .yr-num {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px;
    color: var(--gold); flex: none; width: 110px; letter-spacing: 0.02em;
  }
  .yr-name { font-size: 34px; font-weight: 800; line-height: 1.1; }
  .yr-as { font-size: 21px; color: var(--dim); margin-top: 2px; }
  .foot {
    margin-top: auto; padding-top: 26px;
    font-size: 24px; color: var(--dim); line-height: 1.4;
    border-left: 3px solid var(--line); padding-left: 18px;
  }
  .err { padding: 40px; font-size: 28px; color: oklch(0.72 0.19 40); }

  /* Export: 1:1, page sized to the frame, nothing overlaid. */
  html[data-export], body[data-export] { display: block; overflow: visible; height: auto; width: auto; }
  .shell { display: contents; }
  body[data-export] .shell { display: block; overflow: hidden; margin: 0; }
  body[data-export] .frame { position: relative; left: 0; top: 0; transform-origin: top left; }
  body[data-export] .hint { display: none; }
  .hint { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
          font-size: 12px; color: #555; font-family: ui-monospace, monospace; }

  /* ── X cards ──────────────────────────────────────────────────
     Timeline cuts of the sections a reader actually gets: the
     board, the record book, the playoff race.

     SAME MASTHEAD, TYPE AND PALETTE AS THE PRODUCT, deliberately.
     The campaign's whole claim is "this is what you will see", and
     a card that looks like marketing instead of the page undoes
     that in one scroll.

     SIX ROWS, NOT TEN. X column-crops a feed image, so a full
     ten-team board is a grey smudge until someone taps it. Six
     rows sized this large read at timeline scale, which is the
     only size that matters. */
  .xc { display: flex; flex-direction: column; height: 100%; }
  .xc-top { display: flex; align-items: baseline; justify-content: space-between; }
  .xc-mark {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 30px;
    letter-spacing: 0.24em; text-transform: uppercase;
  }
  .xc-league {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
  }
  .xc-rule { height: 3px; background: var(--line); margin: 14px 0 22px; }
  .xc-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  .xc-title { font-size: 64px; font-weight: 900; letter-spacing: -0.03em; line-height: 0.95; }
  .xc-when {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--pink);
  }
  .xc-rows { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  /* Rows share the frame rather than stacking from the top, so a
     four-row record book fills the same card a six-row board does
     instead of trailing half a frame of dead space. */
  .xc-row {
    display: flex; align-items: center; gap: 24px; position: relative; overflow: hidden;
    background: var(--panel); border-radius: 16px; padding: 14px 26px;
    flex: 1; min-height: 0;
  }
  .xc-rank {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 46px;
    width: 60px; flex: none; color: var(--gold); text-align: center;
  }
  .xc-av {
    width: 76px; height: 76px; border-radius: 14px; flex: none; overflow: hidden;
    background: oklch(0.24 0.02 90); display: grid; place-items: center;
    font-weight: 800; font-size: 26px; color: var(--muted);
  }
  .xc-av img { width: 100%; height: 100%; object-fit: cover; }
  /* Spans stack only when told to; inline by default the sub line
     sat on top of the name. Same trap as `.names` above. */
  .xc-lines { flex: 1; min-width: 0; }
  .xc-lines > span { display: block; }
  .xc-name {
    font-size: 40px; font-weight: 800; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .xc-sub { font-size: 25px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .xc-stat { flex: none; text-align: right; min-width: 200px; }
  .xc-stat b {
    display: block; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 46px; line-height: 1;
  }
  .xc-stat i {
    display: block; font-style: normal; font-size: 19px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dim); margin-top: 4px;
  }
  /* Fill behind the row, so the race is readable before the number is.
     The stacking rule below must EXCLUDE the bar: as a direct child it
     was being handed `position: relative` too, which dropped it back
     into flow, ate a percentage of the row's width and truncated every
     team name to "Gridiron …". */
  .xc-bar { position: absolute; left: 0; top: 0; bottom: 0; background: oklch(0.30 0.06 92 / 0.55); }
  .xc-row > *:not(.xc-bar) { position: relative; }
  /* ── X hero ───────────────────────────────────────────────────
     The ad shape: pitch on the left, the product itself tilted off
     the right edge. Everything inside the phone is rendered LIVE
     from the same Sleeper table the other cards use, rather than a
     pasted screenshot — a football promo carrying a shot of the
     baseball demo is exactly the kind of leak that gets noticed. */
  body[data-hero] .safe { left: 0; top: 0; width: 100%; height: 100%; }
  .xh { position: absolute; inset: 0; overflow: hidden; }
  .xh-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(72% 92% at 80% 46%, oklch(0.52 0.24 350 / 0.50), transparent 62%),
      radial-gradient(46% 64% at 100% 12%, oklch(0.62 0.18 60 / 0.22), transparent 70%),
      var(--bg);

  .xh-dots {

    background-image: radial-gradient(oklch(0.60 0.02 90 / 0.16) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
  }
  /* Vertically centered, like the reference: the pitch owns its half
     of the frame instead of huddling in the top corner. */
  .xh-copy { position: absolute; left: 5.5%; top: 50%; transform: translateY(-50%); width: 46%; }
  .xh-logo { height: 92px; margin-bottom: 52px; display: block; }
  .xh-h1 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 148px;
    line-height: 0.88; text-transform: uppercase; margin: 0 0 40px;
  }
  .xh-sub { font-size: 38px; line-height: 1.32; color: var(--ink); opacity: 0.9; }
  .xh-accent { font-size: 38px; font-style: italic; font-weight: 700; color: var(--pink); margin-top: 8px; }
  .xh-plat { display: flex; align-items: center; gap: 34px; margin-top: 60px; }
  .xh-plat img { height: 56px; }
  .xh-plat b { width: 2px; height: 46px; background: var(--line); }

  /* Bleeds off the right edge on purpose: a device fully inside the
     frame reads as a screenshot, one running off it reads as depth. */
  .xh-phone {
    position: absolute; right: -60px; top: 50%; width: 620px; height: 1240px;
    margin-top: -620px; padding: 13px; border-radius: 62px;
    background: linear-gradient(160deg, oklch(0.42 0.01 90), oklch(0.22 0.01 90));
    /* Shallower than the reference's tilt: at -18deg/-7deg the far
       column of scores fell off the frame's right edge. */
    transform: perspective(2400px) rotateY(-14deg) rotateZ(-5deg);
    box-shadow: 0 60px 150px oklch(0 0 0 / 0.75);
  }
  .xh-screen {
    width: 100%; height: 100%; border-radius: 50px; overflow: hidden;
    background: var(--bg); display: flex; flex-direction: column;
    /* Top clears the frame's cut so the masthead survives the bleed;
       right is deeper than left because the rotateY pushes that edge

  .xh-mast {

    letter-spacing: 0.22em; text-transform: uppercase;
  }
  .xh-eyebrow {

  /* Screens with few rows (record book, matchups) spread down the
     device rather than inflating — four tower-height cards read as a

  .xh-mini.fill { flex: 1; justify-content: space-evenly; }
  .xh-mini.fill .xh-mrow { padding: 22px 16px; }

  /* Matchup rows on the device: two crests, the split in the gold. */

           background: var(--panel); border-radius: 14px; padding: 12px 16px; }

  /* ── X matchups ─────────────────────────────────────────────
     Two teams per row, the split in the middle. The favorite's side

  .xm-row {

<body>
  <div class="shell" id="shell">
    <div class="frame" id="frame">
      <div class="safe" id="safe"><div class="err">Loading…</div></div>
    </div>
  </div>
  <div class="hint" id="hint"></div>

<script>
const LEAGUES = {
  // `prev` is last season, needed for the "how they finished" line. Both
  // are loaded whichever league is rendering, because a promoted or
  // relegated team's last season lives in the OTHER tier's table.
  lor: { id: '1389692138421239808', prev: '1186844188245356544', name: 'League of Record', eyebrow: 'Top flight',  crest: '/league/lor-logo.png', divisions: true },
  ffl: { id: '1389738108437680128', prev: '1257084943821967360', name: 'Futures Football League', eyebrow: 'Second tier', crest: '/league/ffl-logo.png', divisions: false },
}

// Settled history — keyed on OWNER, because team names move.
const CHAMPIONS = [
  { year: 2019, owner: '460845073509117952', as: 'Black Panther' },
  { year: 2020, owner: '414190204908216320', as: 'Gridiron Man' },
  { year: 2021, owner: '460845073509117952', as: 'Inspector General' },
  { year: 2022, owner: '342904407941357568', as: 'Scuttlebucs' },
  { year: 2023, owner: '414190204908216320', as: 'Gridiron Man' },
  { year: 2024, owner: '414222972006453248', as: 'Mighty Mallards' },
  { year: 2025, owner: '460815427782569984', as: 'The Aman-Ra Stars' },
]
const TITLES = CHAMPIONS.reduce((m, c) => (m[c.owner] = (m[c.owner] || 0) + 1, m), {})

const params = new URLSearchParams(location.search)
const view = params.get('view') || 'lor'
const exporting = params.has('export')
// 16:9 is the X cards' native shape, so they never need ?ratio spelled out.
if (params.get('ratio') === '16x9' || view.startsWith('x-')) document.body.dataset.ratio = '16x9'
if (exporting) { document.body.dataset.export = ''; document.documentElement.dataset.export = '' }

const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
const initials = (s) => String(s || '?').replace(/[^\p{L}\p{N} ]/gu, '').trim().split(/\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase() || '?'

function cups(n) {
  if (!n) return ''
  return `<span class="cups">${'<span class="cup">🏆</span>'.repeat(Math.min(n, 2))}${n > 2 ? `<span class="cupn">×${n}</span>` : ''}</span>`
}

function teamRow(t) {
  const n = TITLES[t.owner] || 0
  const av = t.avatar
    ? `<img src="${esc(t.avatar)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${esc(initials(t.team))}'}))">`
    : esc(initials(t.team))
  return `<li ${n ? 'data-champ' : ''}>
    <span class="av">${av}</span>
    <span class="names"><span class="tname">${esc(t.team)}</span></span>
    ${cups(n)}
  </li>`
}

async function loadLeague(key) {
  const cfg = LEAGUES[key]
  const [league, rosters, users] = await Promise.all([
    fetch(`https://api.sleeper.app/v1/league/${cfg.id}`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/league/${cfg.id}/rosters`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/league/${cfg.id}/users`).then((r) => r.json()),
  ])
  const byId = Object.fromEntries(users.map((u) => [u.user_id, u]))
  const teams = rosters.map((r) => {
    const u = byId[r.owner_id] || {}
    const md = u.metadata || {}
    return {
      owner: r.owner_id,
      // A roster can be orphaned, so never assume an owner resolves.
      team: md.team_name || `Team ${r.roster_id}`,
      avatar: md.avatar || (u.avatar ? `https://sleepercdn.com/avatars/${u.avatar}` : null),
      division: (r.settings || {}).division || 0,
    }
  })
  const md = league.metadata || {}
  const groups = cfg.divisions
    ? [...new Set(teams.map((t) => t.division))].sort().map((d) => ({
        label: md[`division_${d}`] || `Division ${d}`,
        teams: teams.filter((t) => t.division === d),
      }))
    : [{ label: null, teams }]

  document.getElementById('safe').innerHTML = `
    <div class="head">
      <img class="crest" src="${cfg.crest}" alt="">
      <div class="head-copy">
        <div class="eyebrow">${esc(cfg.eyebrow)}</div>
        <h1>${esc(league.name || cfg.name)}</h1>
        <div class="sub">${teams.length} teams · ${league.season}</div>
      </div>
    </div>
    <div class="cols">
      ${groups.map((g) => `
        ${g.label ? `<div class="divhead">${esc(g.label)}</div>` : ''}
        <ol>${g.teams.map(teamRow).join('')}</ol>
      `).join('')}
    </div>`
}

async function currentFranchises() {
  // Both leagues, so a champion who has since been relegated still
  // resolves to the franchise they run today.
  const out = {}
  await Promise.all(Object.values(LEAGUES).map(async (cfg) => {
    const [rosters, users] = await Promise.all([
      fetch(`https://api.sleeper.app/v1/league/${cfg.id}/rosters`).then((r) => r.json()),
      fetch(`https://api.sleeper.app/v1/league/${cfg.id}/users`).then((r) => r.json()),
    ])
    const byId = Object.fromEntries(users.map((u) => [u.user_id, u]))
    for (const r of rosters) {
      const u = byId[r.owner_id]
      if (!u) continue
      const md = u.metadata || {}
      out[r.owner_id] = {
        team: md.team_name || `Team ${r.roster_id}`,
        avatar: md.avatar || (u.avatar ? `https://sleepercdn.com/avatars/${u.avatar}` : null),
      }
    }
  }))
  return out
}

/**
 * The honours board, as FRANCHISES ranked by titles.
 *
 * It used to be a year-by-year list with a trophy marking anyone who
 * had won more than once — which read as "this is the year they got a
 * trophy", leaving 2024 and 2025 apparently trophyless. The question
 * people actually ask is "who has won this thing", so that is what it
 * answers now. The season-by-season list survives at ?view=seasons.
 */
async function loadHonours() {
  const now = await currentFranchises()
  const byOwner = new Map()
  for (const c of CHAMPIONS) {
    const e = byOwner.get(c.owner) || { owner: c.owner, years: [], as: c.as }
    e.years.push(c.year)
    byOwner.set(c.owner, e)
  }
  const rows = [...byOwner.values()]
    .map((e) => ({ ...e, ...(now[e.owner] || { team: e.as }) }))
    // Most titles first; a tie goes to whoever won most recently.
    .sort((a, b) => b.years.length - a.years.length || Math.max(...b.years) - Math.max(...a.years))

  document.getElementById('safe').innerHTML = `
    <div class="head">
      <img class="crest" src="${LEAGUES.lor.crest}" alt="">
      <div class="head-copy">
        <div class="eyebrow">The honours board</div>
        <h1>Who's won it.</h1>
        <div class="sub">League of Record · ${CHAMPIONS[0].year}–${CHAMPIONS[CHAMPIONS.length - 1].year}</div>
      </div>
    </div>
    <div class="champs">
      ${rows.map((r) => `
        <div class="champ-row" ${r.years.length > 1 ? 'data-multi' : ''}>
          <span class="champ-av">${r.avatar ? `<img src="${esc(r.avatar)}" alt="">` : esc(initials(r.team))}</span>
          <span class="champ-copy">
            <span class="champ-name">${esc(r.team)}</span>
            <span class="champ-years">${r.years.sort((a, b) => a - b).join(' · ')}</span>
          </span>
          <span class="champ-cups">${'🏆'.repeat(r.years.length)}</span>
        </div>`).join('')}
    </div>
    <p class="foot">Seven seasons, ${rows.length} different champions. Nobody has ever gone back to back.</p>`
}

/** The original season-by-season list, kept for when the story is the
 *  order things happened rather than who has won most. */
async function loadSeasons() {
  const now = await currentFranchises()
  const nameOf = (c) => (now[c.owner] || {}).team || c.as
  const same = (a, b) => String(a).trim() === String(b).trim()
  document.getElementById('safe').innerHTML = `
    <div class="head">
      <img class="crest" src="${LEAGUES.lor.crest}" alt="">
      <div class="head-copy">
        <div class="eyebrow">Season by season</div>
        <h1>Every champion.</h1>
        <div class="sub">League of Record · ${CHAMPIONS[0].year}–${CHAMPIONS[CHAMPIONS.length - 1].year}</div>
      </div>
    </div>
    <div class="years">
      ${[...CHAMPIONS].reverse().map((c) => `
        <div class="yr">
          <span class="yr-num">${c.year}</span>
          <span class="names"><span class="yr-name">${esc(nameOf(c))}</span>${!same(nameOf(c), c.as) ? `<span class="yr-as">won as ${esc(c.as)}</span>` : ''}</span>
        </div>`).join('')}
    </div>`
}

/**
 * One team's countdown card: rank, crest, and the starting nine.
 *
 * The lineup is built the way the app builds it — most-restrictive slot
 * first, so a flex cannot swallow the only tight end and leave the TE
 * slot empty. Same projections, same scoring, so the number on the card
 * is the number in the issue.
 */
const SLOT_ELIGIBLE = { QB: ['QB'], RB: ['RB'], WR: ['WR'], TE: ['TE'], FLEX: ['RB', 'WR', 'TE'] }

function bestLineup(roster, slots) {
  const pool = [...roster].sort((a, b) => b.pts - a.pts)
  // Most restrictive first: one eligible position before three.
  const order = slots
    .map((slot, i) => ({ slot, i, width: (SLOT_ELIGIBLE[slot] || [slot]).length }))
    .sort((a, b) => a.width - b.width || a.i - b.i)
  const out = new Array(slots.length)
  const used = new Set()
  for (const { slot, i } of order) {
    const ok = SLOT_ELIGIBLE[slot] || [slot]
    const pick = pool.find((p) => !used.has(p.id) && ok.includes(p.pos))
    if (pick) { used.add(pick.id); out[i] = { slot, ...pick } }
    else out[i] = { slot, name: '—', pts: 0, pos: '' }
  }
  return out
}

/**
 * Expected points per week — what the card actually ranks on.
 *
 * "Best lineup" assumes all fourteen players are available all seventeen
 * weeks, which makes a bench worth exactly nothing. Real seasons take
 * starters away: one bye plus a couple of missed games is roughly three
 * of seventeen, so P_AVAIL is 0.82. When a player is out you start the
 * best replacement you own — and when you own nobody, you stream, which
 * is what REPL is: the best player at that position rostered in neither
 * league. This is why a single-QB roster gives points back and a deep
 * one does not.
 *
 * Computed exactly rather than sampled — every availability combination,
 * weighted by its probability — so the number on the card is the same
 * number every time it is generated.
 */
const P_AVAIL = 0.82
const REPL = { QB: 14.58, RB: 5.93, WR: 8.15, TE: 7.32, FLEX: 8.15 }

function fillFrom(byPos) {
  let tot = 0
  const left = []
  for (const [pos, n] of [['QB', 1], ['RB', 2], ['WR', 2], ['TE', 1]]) {
    const v = byPos[pos]
    for (let i = 0; i < n; i++) tot += i < v.length ? v[i] : REPL[pos]
    if (pos !== 'QB') for (let i = n; i < v.length; i++) left.push(v[i])
  }
  left.sort((a, b) => b - a)
  for (let i = 0; i < 3; i++) tot += i < left.length ? left[i] : REPL.FLEX
  return tot
}

function expectedWeekly(roster) {
  // Sorted descending within each position, so a subset's available list
  // comes out sorted by construction and never needs re-sorting.
  const pl = ['QB', 'RB', 'WR', 'TE'].flatMap((pos) =>
    roster.filter((p) => p.pos === pos).sort((a, b) => b.pts - a.pts)
      .map((p) => ({ pos, val: p.pts / 17 })))
  const n = pl.length
  const q = 1 - P_AVAIL
  const pk = [], qk = []
  for (let i = 0; i <= n; i++) { pk[i] = P_AVAIL ** i; qk[i] = q ** i }
  let total = 0
  for (let mask = 0; mask < (1 << n); mask++) {
    let k = 0
    for (let m = mask; m; m &= m - 1) k++
    const w = pk[k] * qk[n - k]
    if (w < 1e-12) continue
    const byPos = { QB: [], RB: [], WR: [], TE: [] }
    for (let i = 0; i < n; i++) if (mask & (1 << i)) byPos[pl[i].pos].push(pl[i].val)
    total += w * fillFrom(byPos)
  }
  return total
}

/**
 * Season odds. Not computable here — they come from simulating each
 * league's real fourteen-week schedule and playoff format 200,000 times,
 * with the weekly scoring spread measured from that league's own 2025
 * results. Regenerate with scripts/season-odds when rosters change.
 *
 * Keyed on OWNER, for the same reason CHAMPIONS is: a manager renamed
 * their team mid-week and a name-keyed table silently dropped their odds
 * off the card. Owner ids survive renames, promotion and relegation.
 */
const ODDS = {
  lor: {
    '460815427782569984':  { playoffs: 80, tail: 7 },   // The Aman-Ra Stars
    '414222972006453248':  { playoffs: 79, tail: 8 },   // Mighty Mallards
    '342904407941357568':  { playoffs: 75, tail: 9 },   // Scuttlebucs
    '414190204908216320':  { playoffs: 67, tail: 14 },  // Gridiron Man
    '1263999646091460608': { playoffs: 68, tail: 13 },  // Chancla Warriors
    '651270241543868416':  { playoffs: 55, tail: 22 },  // The Juggernauts
    '1004143904419045376': { playoffs: 50, tail: 25 },  // Pigskin Prophtz
    '809255351798038528':  { playoffs: 50, tail: 27 },  // OverDrive
    '462641888436940800':  { playoffs: 40, tail: 36 },  // East Coast Enforcers
    '857090100046213120':  { playoffs: 36, tail: 40 },  // Game of Throws
  },
  ffl: {
    '856343193405497344':  { playoffs: 80, tail: 39 },  // UCDUST
    '609396639873970176':  { playoffs: 65, tail: 22 },  // Go Birds
    '866081289881686016':  { playoffs: 54, tail: 15 },  // Dom perignons
    '441408338803027968':  { playoffs: 51, tail: 14 },  // Aggresive Chickens
    '786079158324428800':  { playoffs: 53, tail: 14 },  // The Jabariz
    '460845073509117952':  { playoffs: 49, tail: 12 },  // Black Panther
    '858899987772325888':  { playoffs: 45, tail: 11 },  // HazeHunters
    '1001636464716804096': { playoffs: 47, tail: 11 },  // Cabuloso Pats
    '466332448230207488':  { playoffs: 44, tail: 10 },  // StreetGliders
    '1398693580465246208': { playoffs: 41, tail: 9 },   // HawkForceOne
    '1399190785370357760': { playoffs: 36, tail: 7 },   // Zenyatta
    '414202398039343104':  { playoffs: 37, tail: 7 },   // Primetime Primates
  },
}
const TAIL_LABEL = { lor: 'relegated', ffl: 'promoted' }

/**
 * Last season, keyed on OWNER — the same reason CHAMPIONS is: team names
 * move, and this line has to survive a rename, a promotion and a
 * relegation. A manager who isn't in either tier's previous table is
 * genuinely new, which is its own answer.
 */
const _seasonCache = {}
const ORD = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]) }

async function seasonSummary(leagueId) {
  if (_seasonCache[leagueId]) return _seasonCache[leagueId]
  const [lg, rosters] = await Promise.all([
    fetch(`https://api.sleeper.app/v1/league/${leagueId}`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/league/${leagueId}/rosters`).then((r) => r.json()),
  ])
  const md = lg.metadata || {}
  const rows = rosters.map((r) => ({
    owner: r.owner_id,
    w: r.settings?.wins || 0,
    l: r.settings?.losses || 0,
    pf: (r.settings?.fpts || 0) + (r.settings?.fpts_decimal || 0) / 100,
    div: r.settings?.division,
    divName: md[`division_${r.settings?.division}`] || null,
  }))
  // Sleeper's own tiebreak: wins, then points for.
  const ranked = [...rows].sort((a, b) => b.w - a.w || b.pf - a.pf)
  ranked.forEach((x, i) => { x.rank = i + 1 })
  for (const d of new Set(rows.map((x) => x.div).filter(Boolean))) {
    ranked.filter((x) => x.div === d).forEach((x, i) => { x.divRank = i + 1 })
  }
  const out = { size: rows.length, by: {} }
  for (const x of rows) if (x.owner) out.by[x.owner] = x
  _seasonCache[leagueId] = out
  return out
}

/**
 * "East Coast Enforcers" is twenty characters and does not fit next to a
 * 172px crest at the size "UCDUST" wants to be. Step the type down rather
 * than ellipsing a team's name off the end of its own card. Counted by
 * code point, because two of these names carry emoji.
 */
function nameSize(team, solo) {
  const n = [...team].length
  if (solo) return n <= 15 ? 76 : n <= 18 ? 66 : 58
  return n <= 15 ? 62 : n <= 18 ? 54 : 47
}

/**
 * Black Panther's and Go Birds' 2025 rosters were deleted after the season
 * finished. Sleeper still carries the roster rows and their records, but
 * `owner_id` came back null, so there is no way to link either record to
 * the manager who earned it. Without this, two relegated teams render as
 * "New this season", which is the opposite of their story.
 */
const ORPHANED_2025 = {
  '460845073509117952': { w: 2, l: 12, from: 'lor' },  // Black Panther
  '609396639873970176': { w: 4, l: 10, from: 'lor' },  // Go Birds
}

function lastSeasonLabel(owner, key, own, other) {
  const orphan = ORPHANED_2025[owner]
  if (orphan) {
    return orphan.from === 'lor'
      ? `Relegated · ${orphan.w}-${orphan.l} in the top flight`
      : `Promoted · ${orphan.w}-${orphan.l} in the FFL`
  }
  const a = own.by[owner]
  if (a) {
    return a.divName
      ? `${a.w}-${a.l} · ${ORD(a.divRank)} in the ${a.divName}`
      : `${a.w}-${a.l} · ${ORD(a.rank)} of ${own.size}`
  }
  const b = other.by[owner]
  if (b) {
    return key === 'lor'
      ? `Promoted · ${b.w}-${b.l} in the FFL`
      : `Relegated · ${b.w}-${b.l} in the top flight`
  }
  return 'New this season'
}

const _prCache = {}
// The ranked table, built once per league. expectedWeekly enumerates every
// availability combination, so rebuilding it for each of twelve frames is
// millions of redundant lineup evaluations — enough to stall a capture.
const _tableCache = {}

async function renderRank(want, host) {
  // ?lg=ffl for the second tier; defaults to the top flight.
  const cfg = LEAGUES[params.get('lg') === 'ffl' ? 'ffl' : 'lor']

async function rankedTeams(cfg) {
  if (_tableCache[cfg.id]) return _tableCache[cfg.id]
  const [league, rosters, users, proj] = _prCache[cfg.id] || await Promise.all([
    fetch(`https://api.sleeper.app/v1/league/${cfg.id}`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/league/${cfg.id}/rosters`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/league/${cfg.id}/users`).then((r) => r.json()),
    fetch('https://api.sleeper.app/projections/nfl/2026?season_type=regular' +
      '&position[]=QB&position[]=RB&position[]=WR&position[]=TE&order_by=ppr').then((r) => r.json()),
  ])
  _prCache[cfg.id] = [league, rosters, users, proj]   // every card, one fetch
  // Half-PPR, matching the league's scoring settings.
  const P = {}
  for (const row of proj) {
    const id = String(row.player_id)
    P[id] = {
      pts: row.stats?.pts_half_ppr ?? 0,
      pos: row.player?.position ?? '',
      name: [row.player?.first_name, row.player?.last_name].filter(Boolean).join(' '),
    }
  }
  const slots = (league.roster_positions || []).filter((x) => !['BN', 'IR', 'TAXI'].includes(x))
  const byId = Object.fromEntries(users.map((u) => [u.user_id, u]))

  const key = params.get('lg') === 'ffl' ? 'ffl' : 'lor'
  const teams = rosters.map((r) => {
    const roster = (r.players || []).map((id) => ({ id, ...(P[id] || { pts: 0, pos: '', name: id }) }))
    const nine = bestLineup(roster, slots)
    const season = nine.reduce((t, p) => t + p.pts, 0)
    const u = byId[r.owner_id] || {}
    const md = u.metadata || {}
    // Sleeper stores whatever was typed, spaces included.
    const team = (md.team_name || `Team ${r.roster_id}`).trim()
    return {
      team,
      owner: r.owner_id,
      avatar: md.avatar || (u.avatar ? `https://sleepercdn.com/avatars/${u.avatar}` : null),
      fullStrength: season / 17,
      perWeek: expectedWeekly(roster),
      odds: ODDS[key][r.owner_id] || null,
      nine,
    }
  }).sort((a, b) => b.perWeek - a.perWeek)

  _tableCache[cfg.id] = teams
  return teams
}

/**
 * Week matchups with a win split. ?wk=1 picks the week.
 *
 * Same normal approximation the campaign copy quotes: expected weekly
 * points from the lineup model, sigma 25 a team. The site's matchup
 * page runs its own engine; at coin-flip resolution they agree, and
 * the card and the copy MUST agree with each other, which is the
 * reason this shares the copy's math rather than inventing a third.
 */
/** Week pairings with a win split, favorite first, closest last. */
async function weekWinSplits(cfg, wk, table) {
  const [ms, rosters] = await Promise.all([
    fetch(`https://api.sleeper.app/v1/league/${cfg.id}/matchups/${wk}`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/league/${cfg.id}/rosters`).then((r) => r.json()),
  ])
  const ownerByRoster = Object.fromEntries(rosters.map((r) => [r.roster_id, r.owner_id]))
  const byOwner = Object.fromEntries(table.map((t) => [t.owner, t]))
  const groups = {}
  for (const m of ms) {
    if (m.matchup_id == null) continue   // byes invent phantom matchups
    ;(groups[m.matchup_id] ||= []).push(m)
  }
  const SIGMA_DIFF = 25 * Math.SQRT2
  const cdf = (z) => 0.5 * (1 + Math.tanh(Math.sqrt(Math.PI / 8) * z * (1 + 0.044715 * z * z * (Math.PI / 8))))
  return Object.values(groups)
    .map((pair) => {
      const [a, b] = pair.map((m) => byOwner[ownerByRoster[m.roster_id]])
      if (!a || !b) return null
      const pA = Math.round(cdf((a.perWeek - b.perWeek) / SIGMA_DIFF) * 100)
      // Favorite on the left, so the gold number always leads.
      return pA >= 50 ? { fav: a, dog: b, p: pA } : { fav: b, dog: a, p: 100 - pA }
    })
    .filter(Boolean)
    // Closest game last: the card builds tension downward.
    .sort((x, y) => y.p - x.p)
}

async function loadXHero() {
  document.body.dataset.hero = ''
  const cfg = LEAGUES[params.get('lg') === 'ffl' ? 'ffl' : 'lor']
  // The whole table: anything short leaves dead screen at the bottom,
  // and an empty screen in an ad reads as a mockup, not a product.
  const teams = await rankedTeams(cfg)

  const h1 = (params.get('h1') || 'Your league|deserves a|newspaper').split('|')
  const sub = params.get('sub') || 'Power rankings, playoff odds, all-time records, the wire.'
  const accent = params.get('accent') || 'Free for the whole league.'
  const chip = (params.get('chip') || 'Most wins, all time|60 to 59|One game apart going into week 1').split('|')

  // What the device shows: the section this card is selling.
  //   &screen=rank (default) | odds | record | matchups | issue
  const screen = params.get('screen') || 'rank'
  const mav = (t) => `<span class="xh-mav">${t.avatar
    ? `<img src="${esc(t.avatar)}" alt="">`
    : esc(initials(t.team))}</span>`

  let screenTitle = 'Power rankings'
  let mini = ''
  let fill = false

  if (screen === 'odds') {
    screenTitle = 'Playoff odds'
    mini = [...teams]
      .filter((t) => t.odds)
      .sort((a, b) => b.odds.playoffs - a.odds.playoffs)
      .map((t) => `
        <div class="xh-mrow">
          ${mav(t)}
          <span class="xh-mname">${esc(t.team)}</span>
          <span class="xh-mpts">${t.odds.playoffs}%</span>
        </div>`).join('')
  } else if (screen === 'record') {
    screenTitle = 'The record book'
    fill = true
    const now = await currentFranchises()
    mini = MARKERS.map((m) => {
      const f = now[m.owner] || { team: m.name, avatar: null }
      return `
        <div class="xh-mrow">
          ${mav(f)}
          <span class="xh-mname">${esc(f.team)}<span class="xh-msub">${esc(m.label)}</span></span>
          <span class="xh-mpts">${esc(m.value)} ${esc(m.unit)}</span>
        </div>`
    }).join('')
  } else if (screen === 'matchups') {
    screenTitle = 'The matchups'
    fill = true
    const pairs = await weekWinSplits(cfg, Number(params.get('wk') || 1), teams)
    mini = pairs.map((m) => `
      <div class="xh-vs">
        <span class="xh-vs-side">${mav(m.fav)}<span class="xh-vs-name">${esc(m.fav.team)}</span></span>
        <span class="xh-vs-split"><b>${m.p}</b>–${100 - m.p}</span>
        <span class="xh-vs-side right">${mav(m.dog)}<span class="xh-vs-name">${esc(m.dog.team)}</span></span>
      </div>`).join('')
  } else if (screen === 'issue') {
    screenTitle = ''
    mini = `
      <div class="xh-eyebrow" style="margin-top:0">Issue No. 2 · Week 1</div>
      <div class="xh-cover-head">Sixty wins, fifty-nine, and one week to move it.</div>
      <div class="xh-cover-sub">The all-time record enters the season one game wide.
        Five verdicts inside, none of them gentle.</div>
      <div class="xh-eyebrow">The board</div>
      ${teams.slice(0, 4).map((t, i) => `
        <div class="xh-mrow" style="margin-top:12px">
          <span class="xh-mrank">${i + 1}</span>
          ${mav(t)}
          <span class="xh-mname">${esc(t.team)}</span>
          <span class="xh-mpts">${t.perWeek.toFixed(1)}</span>
        </div>`).join('')}`
  } else {
    mini = teams.map((t, i) => `
      <div class="xh-mrow">
        <span class="xh-mrank">${i + 1}</span>
        ${mav(t)}
        <span class="xh-mname">${esc(t.team)}</span>
        <span class="xh-mpts">${t.perWeek.toFixed(1)}</span>
      </div>`).join('')
  }

  document.getElementById('safe').innerHTML = `
    <div class="xh">
      <div class="xh-glow"></div>
      <div class="xh-dots"></div>

      <div class="xh-phone">
        <div class="xh-screen">
          <div class="xh-mast">The League Beat</div>
          <div class="xh-eyebrow">${esc(cfg.name)}</div>
          ${screenTitle ? `<div class="xh-title2">${esc(screenTitle)}</div>` : '<div style="height:24px"></div>'}
          <div class="xh-mini${fill ? ' fill' : ''}">${mini}</div>
        </div>
      </div>

      <div class="xh-chip">
        <div class="xh-chip-k">${esc(chip[0] || '')}</div>
        <div class="xh-chip-v">${esc(chip[1] || '')}</div>
        <div class="xh-chip-s">${esc(chip[2] || '')}</div>
      </div>

      <div class="xh-copy">
        <img class="xh-logo" src="/tlb-logo-primary.png" alt="The League Beat">
        <h1 class="xh-h1">${h1.map((l) => esc(l)).join('<br>')}</h1>
        <div class="xh-sub">${esc(sub)}</div>
        <div class="xh-accent">${esc(accent)}</div>
        <div class="xh-plat">
          <img src="/sleeper-logo.svg" alt="Sleeper">
          <b></b>
          <img src="/espn-logo.svg" alt="ESPN">
        </div>
      </div>
    </div>`
}

function fit() {
  const f = document.getElementById('frame')
  if (exporting) {
    const s = Math.min(1, window.innerWidth / f.offsetWidth)
    f.style.transform = `scale(${s})`
    const shell = document.getElementById('shell')
    shell.style.width = `${f.offsetWidth * s}px`
    shell.style.height = `${f.offsetHeight * s}px`
    return
  }
  const scale = Math.min(1, window.innerWidth / f.offsetWidth, window.innerHeight / f.offsetHeight)
  f.style.transform = `translate(-50%, -50%) scale(${scale})`
  document.getElementById('hint').textContent =
    `${f.offsetWidth}x${f.offsetHeight} @ ${(scale * 100).toFixed(0)}%  ·  ?view=rank&n=1..10 | lor|ffl|honours|seasons|title|down|up|champ  ·  X: x-rank|x-odds|x-record  ?ratio=16x9  ?export`
}

;(async () => {
  try {
    if (view === 'honours') await loadHonours()
    else if (view === 'seasons') await loadSeasons()
    else if (view === 'ranks') await loadRanks()
    else if (view === 'rank') await loadRank()
    else if (view === 'title') loadTitle()
    else if (view === 'intro') loadIntro()
    else if (view === 'group') await loadGroup()
    else if (view === 'down' || view === 'up') loadSolo(view)
    else if (view === 'x-hero') await loadXHero()
    else if (view === 'x-rank') await loadXRank()
    else if (view === 'x-odds') await loadXOdds()
    else if (view === 'x-record') await loadXRecord()
    else if (view === 'x-matchups') await loadXMatchups()
    else if (view === 'champ') await loadChamp()
    else await loadLeague(view in LEAGUES ? view : 'lor')
  } catch (e) {
    document.getElementById('safe').innerHTML =
      `<div class="err">Couldn't reach Sleeper.<br><small>${esc(e.message)}</small></div>`
  }
  addEventListener('resize', fit)
  document.fonts.ready.then(fit)
  fit()
})()
</script>
</body>
</html>
